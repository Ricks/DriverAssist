<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>DriverAssist Flow Arrow Debug Viewer</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #14161a; color: #e6e6e6;
    font-family: -apple-system, "SF Mono", Menlo, monospace;
    display: flex; flex-direction: column; align-items: center; padding: 16px;
  }
  #stage { position: relative; max-width: 100%; }
  #video { display: block; max-width: 100%; background: #000; }
  #overlay { position: absolute; top: 0; left: 0; cursor: crosshair; }
  #controls {
    width: 100%; max-width: 1400px; margin-top: 10px;
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  }
  button, select, input[type=number] {
    background: #23262d; color: #e6e6e6; border: 1px solid #3a3f4a;
    border-radius: 4px; padding: 6px 10px; font: inherit; cursor: pointer;
  }
  button:hover { background: #2d323b; }
  button.active { background: #5a3a7a; border-color: #8a5ac0; }
  #status {
    width: 100%; max-width: 1400px; margin-top: 8px;
    display: flex; gap: 20px; font-size: 13px; color: #9aa; flex-wrap: wrap;
  }
  #status b { color: #e6e6e6; }
  .hint { color: #667; font-size: 12px; }
  #hint { color: #e0b040; font-size: 13px; min-height: 16px; }
  #timeline {
    width: 100%; max-width: 1400px; height: 20px; margin-top: 10px;
    background: #23262d; position: relative; border-radius: 4px; cursor: pointer;
    border: 1px solid #3a3f4a;
  }
  #timelineFill {
    position: absolute; top: 0; bottom: 0; left: 0; width: 0;
    background: #3a3f7a; border-radius: 4px 0 0 4px; pointer-events: none;
  }
  .playhead {
    position: absolute; top: -4px; bottom: -4px; width: 3px; margin-left: -1.5px;
    background: #fff; border-radius: 2px; pointer-events: none;
    box-shadow: 0 0 4px rgba(255,255,255,0.8);
  }
  #detail {
    width: 100%; max-width: 1400px; margin-top: 10px; padding: 10px 12px;
    background: #1b1e24; border: 1px solid #3a3f4a; border-radius: 6px;
    font-size: 13px; line-height: 1.6; display: none; white-space: pre;
  }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; }
  .swatch { display: inline-block; width: 12px; height: 12px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
</style>
</head>
<body>

<div id="stage">
  <video id="video" preload="auto"></video>
  <canvas id="overlay"></canvas>
</div>

<div id="controls">
  <button id="stepBack">&larr; frame</button>
  <button id="playRev">&#9664; reverse</button>
  <button id="playPause">&#9654; play</button>
  <button id="stepFwd">frame &rarr;</button>
  <span class="hint">speed</span>
  <select id="speed">
    <option value="0.1">0.1x</option>
    <option value="0.25">0.25x</option>
    <option value="0.5">0.5x</option>
    <option value="1" selected>1x</option>
    <option value="2">2x</option>
    <option value="4">4x</option>
    <option value="8">8x</option>
    <option value="16">16x</option>
  </select>
  <span class="hint">step size (s)</span>
  <input type="number" id="stepSize" value="0.067" step="0.001" min="0.001" style="width:70px">
  <span class="hint" id="modeHint">| click a box for full overlay + details &middot; click again / empty space / Esc to clear &middot; keys: &larr;/&rarr; step, space play/pause</span>
</div>

<div id="status">
  <span>t = <b id="curTime">0.00</b>s</span>
  <span>frame dets: <b id="detCount">0</b></span>
  <span>selected: <b id="selectedLabel">none</b></span>
  <span class="legend" id="legend"></span>
</div>
<div id="hint"></div>

<div id="timeline"><div id="timelineFill"></div></div>

<pre id="detail"></pre>

<script>
const video = document.getElementById('video');
const overlay = document.getElementById('overlay');
const ctx = overlay.getContext('2d');
const timeline = document.getElementById('timeline');
const detailEl = document.getElementById('detail');
const hintEl = document.getElementById('hint');

const LABEL_COLORS = {
  person: '#ffff00', bicycle: '#00ffff', motorcycle: '#00ffff',
  car: '#00ff00', bus: '#ff3333', truck: '#ff3333',
};

// Same convention/order as reconstruct_annotated.py's --flow-arrows: cyan
// (this frame's predicted ego-motion flow), green (previous frame's), blue
// (raw observed rate), magenta (raw single-step motion, the EXACT
// avg(green,cyan)+magenta=blue identity that file's own doc comments
// describe), red (the tracker's smoothed, physically-gated motion --
// solid/opaque, the one arrow shown by default; see
// tracker.py's Track.update_flow_state).
const VECTORS = [
  { key: 'flowAngular',           color: '#00ffff', label: 'predicted flow (this frame)' },
  { key: 'prevFlowAngular',       color: '#00ff00', label: 'predicted flow (previous frame)' },
  { key: 'observedRateAngular',   color: '#0000ff', label: 'observed rate (raw)' },
  { key: 'motionAngular',         color: '#ff00ff', label: 'motion (raw, single-step)' },
];
const SMOOTHED = { key: 'smoothedMotionAngular', color: '#ff0000', label: 'motion (smoothed, trust this)' };

for (const v of [...VECTORS, SMOOTHED, { color: '#ffa500', label: 'ALGORITHM = classify_leading/LeadingVehicleLock pick' }]) {
  const s = document.createElement('span');
  s.innerHTML = `<span class="swatch" style="background:${v.color}"></span>${v.label}`;
  document.getElementById('legend').appendChild(s);
}

// Same calibrated-camera constants as flow_model.py -- pure geometry
// (converting an already-computed angular rate to on-screen pixels), not a
// physics reimplementation, so duplicating it here client-side is fine;
// the actual flow/motion MATH all happened server-side in
// reconstruct_annotated.py and is just being read back.
const FOCAL_LENGTH_ROW_NORMALIZED = 1.322673;

function angularToPixels(u, v, frameW, frameH) {
  const aspect = frameW / frameH;
  const fRow = FOCAL_LENGTH_ROW_NORMALIZED;
  const fCol = fRow / aspect;
  return [u * fCol * frameW, v * fRow * frameH];
}
function baseCenterNormalized(d) {
  return [d.x + d.w / 2, d.y + d.h];
}

let frames = [];   // [{t, detections:[{trackID,label,confidence,x,y,w,h,correctedDistanceMeters,widthOverridden,flowAngular,...}]}]
let videoResolution = null;  // the recording's own raw capture resolution, e.g. "3840x2160" -- distinct from each frame's "resolution" (the detector's input buffer size)
let videoFps = null;
let duration = 0;
let selectedTrackID = null;
let reverseTimer = null;

video.src = '/video';
fetch('/api/frames').then(r => r.json()).then(data => {
  frames = data.frames; videoResolution = data.videoResolution; videoFps = data.videoFps;
});

video.addEventListener('loadedmetadata', () => {
  duration = video.duration;
  resizeCanvas();
});
window.addEventListener('resize', resizeCanvas);

function resizeCanvas() {
  const r = video.getBoundingClientRect();
  overlay.style.width = r.width + 'px';
  overlay.style.height = r.height + 'px';
  overlay.width = r.width;
  overlay.height = r.height;
  overlay.style.top = video.offsetTop + 'px';
  overlay.style.left = video.offsetLeft + 'px';
  draw();
}

// --- Binary search for the last frame with t <= currentTime ---
function frameAt(t) {
  if (frames.length === 0) return null;
  let lo = 0, hi = frames.length - 1, ans = 0;
  while (lo <= hi) {
    const mid = (lo + hi) >> 1;
    if (frames[mid].t <= t) { ans = mid; lo = mid + 1; } else { hi = mid - 1; }
  }
  return frames[ans];
}

function drawArrow(x0, y0, x1, y1, color) {
  const len = Math.hypot(x1 - x0, y1 - y0);
  if (len < 1) return;
  ctx.strokeStyle = color;
  ctx.fillStyle = color;
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
  const angle = Math.atan2(y1 - y0, x1 - x0);
  const headLen = 12, headAngle = 0.55;
  const p2x = x1 - headLen * Math.cos(angle - headAngle), p2y = y1 - headLen * Math.sin(angle - headAngle);
  const p3x = x1 - headLen * Math.cos(angle + headAngle), p3y = y1 - headLen * Math.sin(angle + headAngle);
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(p2x, p2y); ctx.lineTo(p3x, p3y); ctx.closePath(); ctx.fill();
}

// Display-only unit conversions -- everything stays in meters/(m/s)
// internally (the JSON, the detail panel, all the math) so nothing
// upstream needs to change; these only affect what's drawn on screen.
const METERS_TO_YARDS = 1.0936133;
const MPS_TO_MPH = 2.2369363;

function drawVector(d, w, h, key, color) {
  const rate = d[key];
  if (!rate) return null;
  const [bx, by] = baseCenterNormalized(d);
  const [dx, dy] = angularToPixels(rate[0], rate[1], w, h);
  const tipX = bx * w + dx, tipY = by * h + dy;
  drawArrow(bx * w, by * h, tipX, tipY, color);
  return [tipX, tipY];
}

// Real-world speed magnitude at this detection's own depth -- converts the
// smoothed angular rate (smoothedMotionAngular, already ego-motion-
// subtracted and per-class-EMA-smoothed, see tracker.py's
// Track.update_flow_state) to linear velocity the same way the "3D
// motion vector" sketch discussed (Vx=u*z, Vy=v*z), then takes the 2D
// (lateral+vertical only) magnitude. NOTE: this does NOT include the
// object's closing/opening (depth-rate) component -- that axis was never
// built (see the 2026-08-23 "generalize to 3D" discussion) -- so this
// reading UNDERSTATES true speed for anything moving mostly toward or
// away from the camera rather than across it. Returns null if the
// smoothed vector or a usable depth isn't available.
function smoothedSpeedMph(d) {
  const rate = d.smoothedMotionAngular;
  if (!rate || d.correctedDistanceMeters == null) return null;
  const speedMps = Math.hypot(rate[0], rate[1]) * d.correctedDistanceMeters;
  return speedMps * MPS_TO_MPH;
}

// Same translucent-fill + thick-outline + "ALGORITHM" caption as
// draw_tint(frame, locked_det, ALGORITHM_TINT_BGR, "ALGORITHM", label_below=True)
// in reconstruct_annotated.py, for the classify_leading/LeadingVehicleLock
// pick -- BGR (0,165,255) is this same orange.
const LEADING_TINT_COLOR = '#ffa500';

function distanceText(d) {
  return (d.correctedDistanceMeters === null || d.correctedDistanceMeters === undefined)
    ? '? yds' : `${(d.correctedDistanceMeters * METERS_TO_YARDS).toFixed(1)} yds`;
}

// Black-on-white caption on a translucent backing, same as
// draw_label_text in reconstruct_annotated.py.
function drawCaption(text, x, y) {
  ctx.font = '13px monospace';
  const tw = ctx.measureText(text).width;
  const pad = 3;
  ctx.globalAlpha = 0.5;
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(x - pad, y - 13 - pad, tw + pad * 2, 13 + pad + 4);
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#000000';
  ctx.fillText(text, x, y);
}

function drawBox(d, w, h, color, lineWidth) {
  const x = d.x * w, y = d.y * h, bw = d.w * w, bh = d.h * h;
  ctx.strokeStyle = color;
  ctx.lineWidth = lineWidth;
  ctx.strokeRect(x, y, bw, bh);
  // Same "#id label dist m" caption (distance now shown INSTEAD of
  // confidence, matching draw_box's own 2026-08-23 change) at the same
  // inside-top-left position as draw_box/draw_label_text.
  drawCaption(`#${d.trackID} ${d.label} ${distanceText(d)}`, x + 4, y + 18);
}

function drawLeadingTint(d, w, h) {
  const x = d.x * w, y = d.y * h, bw = d.w * w, bh = d.h * h;
  ctx.globalAlpha = 0.35;
  ctx.fillStyle = LEADING_TINT_COLOR;
  ctx.fillRect(x, y, bw, bh);
  ctx.globalAlpha = 1;
  ctx.strokeStyle = LEADING_TINT_COLOR;
  ctx.lineWidth = 3;
  ctx.strokeRect(x, y, bw, bh);
  drawCaption('ALGORITHM', x + 4, y + bh + 18);
}

// Same fields/leading text as draw_hud's on-screen HUD in
// reconstruct_annotated.py, which itself mirrors the live on-device app's
// own HUD labels -- reproduced verbatim here rather than reworded, real
// request 2026-08-23. Layout (thermal/stabilization top, video/res/model/
// low-light bottom) also mirrors that function's corner placement, plus
// the recording's own raw capture resolution (e.g. "3840x2160"/4K,
// "1920x1080"/1080p) -- NOT logged per-frame anywhere on-device, so this
// has no on-screen counterpart to match text against; "video: " is this
// tool's own label, everything else below is verbatim from the real HUD.
function drawHud(f, w, h) {
  ctx.font = '16px monospace';
  if (f.thermal) {
    const stateText = f.thermal.state === 'nominal' ? 'OK' : f.thermal.state.toUpperCase();
    let color = '#bfbfbf';
    if (f.thermal.state === 'fair') color = '#ffd700';
    else if (f.thermal.state === 'serious' || f.thermal.state === 'critical') color = '#ff0000';
    ctx.fillStyle = color;
    ctx.fillText(`thermal: ${stateText} ${f.thermal.percent}%`, 12, 26);
  }
  ctx.fillStyle = '#bfbfbf';
  if (videoResolution) ctx.fillText(`video: ${videoResolution}`, 12, h - 56);
  ctx.fillText(`res: ${f.resolution}`, 12, h - 34);
  ctx.fillText(`model: ${f.model}`, 12, h - 12);

  const lowState = f.lowLightEnabled ? 'on' : 'off';
  const lowText = f.autoLowLightEnabled ? `low-light: auto (${lowState})` : `low-light: ${lowState}`;
  ctx.fillText(lowText, w - ctx.measureText(lowText).width - 12, h - 12);

  const stabText = `stabilization: ${f.stabilizationEnabled ? 'on' : 'off'}`;
  ctx.fillText(stabText, w - ctx.measureText(stabText).width - 12, 26);

  // Same black-on-white "frame N" caption reconstruct_annotated.py's
  // draw_hud draws (added there specifically so an exact frame could be
  // referenced back precisely) -- video.currentTime * fps approximates
  // the raw decoded-frame counter that HUD used, same rounding a CFR
  // video's own frame boundaries imply.
  if (videoFps) {
    const frameIndex = Math.round(video.currentTime * videoFps);
    const text = `frame ${frameIndex}`;
    const tw = ctx.measureText(text).width;
    drawCaption(text, w - tw - 12 - 3, 26 + 40);
  }
}

// How far past the last (or before the first) real detection entry
// video.currentTime may drift before frameAt's "nearest" lookup is treated
// as STALE rather than current -- generously above the normal ~0.13s
// detection cadence so ordinary jitter never false-triggers this, but
// small enough to catch scrubbing/playing past wherever --flow-debug-json
// actually stopped (a real report, 2026-08-23: playing past a JSON
// generated for only the first 180s of a much longer recording left
// frameAt silently returning that last frame's boxes forever afterward,
// with nothing telling the viewer that had happened -- boxes looked
// "stuck," not obviously explained by missing data). frameAt's own binary
// search can't distinguish "this really is the closest frame" from "we've
// run off the end of the data" on its own, so that check has to happen
// here instead, against the frame it actually returned.
const STALE_DATA_THRESHOLD_S = 1.0;

function draw() {
  ctx.clearRect(0, 0, overlay.width, overlay.height);
  const f = frameAt(video.currentTime);
  document.getElementById('curTime').textContent = video.currentTime.toFixed(2);
  document.getElementById('detCount').textContent = f ? f.detections.length : 0;
  if (!f) { renderPlayhead(); return; }
  const w = overlay.width, h = overlay.height;

  const dataGap = video.currentTime - f.t;
  if (Math.abs(dataGap) > STALE_DATA_THRESHOLD_S) {
    const msg = 'No data';
    ctx.font = 'bold 18px monospace';
    const tw = ctx.measureText(msg).width;
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(w / 2 - tw / 2 - 10, h / 2 - 20, tw + 20, 34);
    ctx.fillStyle = '#ff4444';
    ctx.fillText(msg, w / 2 - tw / 2, h / 2 + 4);
    renderPlayhead();
    return;
  }

  let selectedDet = null;
  for (const d of f.detections) {
    const isSelected = d.trackID !== null && d.trackID === selectedTrackID;
    const isLeading = f.lockedLeadingTrackID !== null && d.trackID === f.lockedLeadingTrackID;
    if (isSelected) selectedDet = d;
    drawBox(d, w, h, isSelected ? '#ffffff' : (LABEL_COLORS[d.label] || '#888888'), isSelected ? 3 : 1.5);
    if (isLeading) drawLeadingTint(d, w, h);
    if (isSelected) {
      for (const v of VECTORS) drawVector(d, w, h, v.key, v.color);
    }
    const tip = drawVector(d, w, h, SMOOTHED.key, SMOOTHED.color);
    if (tip) {
      const mph = smoothedSpeedMph(d);
      // "Normal orientation" -- drawn upright/horizontal regardless of
      // the arrow's own angle (no rotation transform), same as every
      // other caption in this file; just anchored at the arrow's tip
      // instead of the box. Small fixed offset so the text doesn't sit
      // directly on top of the arrowhead itself.
      if (mph !== null) drawCaption(`${mph.toFixed(1)} mph`, tip[0] + 6, tip[1] + 4);
    }
  }
  drawHud(f, w, h);
  updateDetail(selectedDet);
  renderPlayhead();
}

function updateDetail(d) {
  document.getElementById('selectedLabel').textContent = d ? `#${d.trackID} ${d.label}` : 'none';
  if (!d) { detailEl.style.display = 'none'; return; }
  const fmt = (v) => v ? `(${v[0].toFixed(4)}, ${v[1].toFixed(4)})` : 'null';
  detailEl.style.display = 'block';
  detailEl.textContent =
    `#${d.trackID} ${d.label}  conf=${(d.confidence * 100).toFixed(1)}%\n` +
    `correctedDistanceMeters = ${d.correctedDistanceMeters === null ? 'null' : d.correctedDistanceMeters.toFixed(2)}` +
    `   widthOverridden = ${d.widthOverridden}\n` +
    `box = x=${d.x.toFixed(4)} y=${d.y.toFixed(4)} w=${d.w.toFixed(4)} h=${d.h.toFixed(4)}  aspect(w/h)=${(d.w / d.h).toFixed(3)}\n` +
    `flowAngular (cyan)          = ${fmt(d.flowAngular)}\n` +
    `prevFlowAngular (green)     = ${fmt(d.prevFlowAngular)}\n` +
    `observedRateAngular (blue)  = ${fmt(d.observedRateAngular)}\n` +
    `motionAngular (magenta, raw)     = ${fmt(d.motionAngular)}\n` +
    `smoothedMotionAngular (red, trust) = ${fmt(d.smoothedMotionAngular)}`;
}

// --- Click to select / deselect ---
function hitTestBox(e) {
  const rect = overlay.getBoundingClientRect();
  const px = e.clientX - rect.left, py = e.clientY - rect.top;
  const PAD_PX = 10;
  const f = frameAt(video.currentTime);
  if (!f || Math.abs(video.currentTime - f.t) > STALE_DATA_THRESHOLD_S) return null;
  let best = null, bestArea = Infinity;
  for (const d of f.detections) {
    const bx = d.x * rect.width, by = d.y * rect.height;
    const bw = d.w * rect.width, bh = d.h * rect.height;
    if (px >= bx - PAD_PX && px <= bx + bw + PAD_PX && py >= by - PAD_PX && py <= by + bh + PAD_PX) {
      const area = bw * bh;
      if (area < bestArea) { bestArea = area; best = d; }
    }
  }
  return best;
}

overlay.addEventListener('click', (e) => {
  const best = hitTestBox(e);
  if (!best || best.trackID === null) {
    selectedTrackID = null;
  } else if (best.trackID === selectedTrackID) {
    selectedTrackID = null;
  } else {
    selectedTrackID = best.trackID;
    // Selecting is for frame-by-frame inspection, not for watching
    // playback continue -- pause so the next natural action is stepping.
    video.pause(); setPlayPauseLabel();
  }
  draw();
});

document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return;
  if (e.code === 'Escape') { selectedTrackID = null; draw(); return; }
  if (e.code === 'Space') { e.preventDefault(); playPauseBtn.click(); }
  else if (e.code === 'ArrowRight') { e.preventDefault(); document.getElementById('stepFwd').click(); }
  else if (e.code === 'ArrowLeft') { e.preventDefault(); document.getElementById('stepBack').click(); }
});

// --- Timeline scrub (click-to-seek AND drag-to-scrub) ---
const timelineFill = document.getElementById('timelineFill');
let playhead = null;
function renderPlayhead() {
  if (!duration) return;
  if (!playhead) { playhead = document.createElement('div'); playhead.className = 'playhead'; timeline.appendChild(playhead); }
  const pct = (video.currentTime / duration * 100) + '%';
  playhead.style.left = pct;
  timelineFill.style.width = pct;
}
function seekFromEvent(e) {
  const rect = timeline.getBoundingClientRect();
  const frac = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
  seekTo(frac * duration);
}
let scrubbing = false;
timeline.addEventListener('mousedown', (e) => {
  if (!duration) return;
  scrubbing = true;
  video.pause(); stopReverse(); setPlayPauseLabel();
  seekFromEvent(e);
});
window.addEventListener('mousemove', (e) => {
  if (scrubbing) seekFromEvent(e);
});
window.addEventListener('mouseup', () => { scrubbing = false; });

// --- Playback / stepping (same mechanics as label_leading_vehicle_frontend.html) ---
function seekTo(t) {
  video.currentTime = Math.max(0, Math.min(duration || Infinity, t));
}
video.addEventListener('timeupdate', draw);
video.addEventListener('seeked', draw);

function stepSize() { return parseFloat(document.getElementById('stepSize').value) || 0.067; }

document.getElementById('stepFwd').addEventListener('click', () => {
  video.pause(); stopReverse(); setPlayPauseLabel();
  seekTo(video.currentTime + stepSize());
});
document.getElementById('stepBack').addEventListener('click', () => {
  video.pause(); stopReverse(); setPlayPauseLabel();
  seekTo(video.currentTime - stepSize());
});

document.getElementById('speed').addEventListener('change', (e) => {
  video.playbackRate = parseFloat(e.target.value);
});

const playPauseBtn = document.getElementById('playPause');
playPauseBtn.addEventListener('click', () => {
  stopReverse();
  if (video.paused) { video.play(); } else { video.pause(); }
  setPlayPauseLabel();
});
video.addEventListener('play', setPlayPauseLabel);
video.addEventListener('pause', setPlayPauseLabel);
function setPlayPauseLabel() {
  playPauseBtn.textContent = video.paused ? '▶ play' : '⏸ pause';
}

// Reverse playback: browsers don't support negative playbackRate reliably,
// so this simulates it with a timer decrementing currentTime.
const reverseBtn = document.getElementById('playRev');
reverseBtn.addEventListener('click', () => {
  if (reverseTimer) { stopReverse(); return; }
  video.pause();
  const rate = parseFloat(document.getElementById('speed').value);
  reverseBtn.classList.add('active');
  reverseTimer = setInterval(() => {
    const next = video.currentTime - rate * 0.05;
    if (next <= 0) { seekTo(0); stopReverse(); return; }
    seekTo(next);
  }, 50);
});
function stopReverse() {
  if (reverseTimer) { clearInterval(reverseTimer); reverseTimer = null; }
  reverseBtn.classList.remove('active');
}
</script>
</body>
</html>
