<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>DriverAssist Super Tool</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #14161a; color: #e6e6e6;
    font-family: -apple-system, "SF Mono", Menlo, monospace;
    display: flex; flex-direction: row; align-items: stretch;
    min-height: 100vh;
  }
  /* left rail: the sessions you've pulled up; click to switch (view state
     per session is kept in the browser so toggling never loses your place) */
  #sessionBar {
    flex: 0 0 216px; width: 216px; display: flex; flex-direction: column;
    background: #181a1f; border-right: 1px solid #2a2f38; height: 100vh; position: sticky; top: 0;
  }
  #sessionBarHead {
    display: flex; align-items: center; gap: 6px; padding: 8px 10px;
    border-bottom: 1px solid #2a2f38; font-size: 12px; color: #9aa;
  }
  #sessionBarHead .grow { flex: 1; }
  #sessionBarHead button {
    width: 26px; height: 24px; padding: 0; font-size: 15px; line-height: 1;
    background: #23262d; color: #e6e6e6; border: 1px solid #3a3f4a; border-radius: 4px; cursor: pointer;
  }
  #sessionBarHead button:hover:not(:disabled) { background: #2d323b; }
  #sessionBarHead button:disabled { color: #555; cursor: default; }
  #sessionList { flex: 1; overflow-y: auto; }
  .sessRow {
    padding: 8px 10px; font-size: 12px; line-height: 1.35; cursor: pointer;
    border-bottom: 1px solid #23262d; color: #cfcfcf; word-break: break-word;
  }
  .sessRow:hover { background: #20232a; }
  .sessRow.active { background: #1f5a4a; color: #fff; }
  .sessRow .sub { display: block; color: #8a94a0; font-size: 10.5px; margin-top: 1px; }
  .sessRow.active .sub { color: #bfe6d6; }
  #sessionListEmpty { padding: 12px 10px; font-size: 11px; color: #667; }
  #main {
    flex: 1; min-width: 0; padding: 16px;
    display: flex; flex-direction: column; align-items: center;
    overflow-x: hidden;   /* let the loupe overhang the frame without a stray scrollbar */
  }
  #stage { position: relative; width: 100%; max-width: 1920px; overflow: hidden; }
  #stageInner { transform-origin: 0 0; }   /* Distance Calibration zoom/pan; identity in every other mode */
  /* Leave enough headroom below the video for every control row (mode
     tabs, controls, status, hint, timeline, DC frame-marker strip) so the
     whole page fits without a vertical scroll. */
  #video { display: block; margin: 0 auto; max-width: 100%; max-height: calc(100vh - 265px); background: #000; }
  #overlay { position: absolute; top: 0; left: 0; cursor: crosshair; }
  #calLabelLayer { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 6; }
  #loupe {
    position: absolute; pointer-events: none; display: none; z-index: 5;
    border-radius: 50%; border: 2px solid #8a5ac0;
    box-shadow: 0 0 0 1px #000, 0 4px 18px rgba(0,0,0,0.65);
  }
  #modes {
    width: 100%; max-width: 1920px;
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 4px;
  }
  #controls {
    width: 100%; max-width: 1920px; margin-top: 10px;
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  }
  button, select, input[type=number] {
    background: #23262d; color: #e6e6e6; border: 1px solid #3a3f4a;
    border-radius: 4px; padding: 6px 10px; font: inherit; cursor: pointer;
  }
  button:hover { background: #2d323b; }
  button.active { background: #5a3a7a; border-color: #8a5ac0; }
  .modeBtn.active { background: #1f5a4a; border-color: #3ac08a; }
  #status {
    width: 100%; max-width: 1920px; margin-top: 8px;
    display: flex; gap: 20px; font-size: 13px; color: #9aa; flex-wrap: wrap;
  }
  #status b { color: #e6e6e6; }
  #hint { color: #e0b040; font-size: 13px; min-height: 16px; }
  #timeline {
    width: 100%; max-width: 1920px; height: 28px; margin-top: 10px;
    background: #23262d; position: relative; border-radius: 4px; cursor: pointer;
    border: 1px solid #3a3f4a;
  }
  #timelineFill {
    position: absolute; top: 0; bottom: 0; left: 0; width: 0;
    background: #3a3f7a; border-radius: 4px 0 0 4px; pointer-events: none;
  }
  .seg {
    position: absolute; top: 3px; bottom: 3px; background: #cc44cc;
    border-radius: 2px; opacity: 0.85; min-width: 2px;
  }
  .seg:hover { opacity: 1; outline: 1px solid #fff; }
  .seg.noted { box-shadow: inset 0 0 0 1px #ffe066; }
  .mark {
    position: absolute; top: 0; bottom: 0; width: 3px; margin-left: -1.5px;
    background: #d2691e; border-radius: 1px; cursor: pointer;
  }
  .mark:hover { outline: 1px solid #fff; }
  .mark.noted { box-shadow: 0 0 0 1px #ffe066; }
  .calmark {
    position: absolute; top: 0; bottom: 0; width: 3px; margin-left: -1.5px;
    background: #ff3b30; border-radius: 1px; cursor: pointer;
  }
  .calmark:hover { outline: 1px solid #fff; }
  /* distance_calibration: upward triangles under the scrub bar, one per
     frame that has reference points -- click to jump to that frame. */
  #calFrameMarkers {
    width: 100%; max-width: 1920px; position: relative; height: 9px; margin-top: 2px;
  }
  #calFrameMarkers .calframe {
    position: absolute; top: 0; width: 0; height: 0; margin-left: -5px;
    border-left: 5px solid transparent; border-right: 5px solid transparent;
    border-bottom: 9px solid currentColor;   /* points up; colour set inline from the picker */
    cursor: pointer;
  }
  #calFrameMarkers .calframe:hover { filter: brightness(1.5); }
  /* distance_calibration: marker-colour picker as a row of colour boxes;
     the selected one gets a contrasting (black/white) ring. */
  #calColorSwatches { display: inline-flex; gap: 4px; align-items: center; vertical-align: middle; }
  #calColorSwatches .calswatch {
    width: 18px; height: 18px; padding: 0; border-radius: 3px;
    border: 1px solid #555; cursor: pointer; box-sizing: border-box;
  }
  #calColorSwatches .calswatch.sel {
    outline: 2px solid var(--ring, #fff); outline-offset: 1px;
    border-color: var(--ring, #fff);
  }
  .playhead {
    position: absolute; top: 0; bottom: 0; width: 2px; background: #fff; pointer-events: none;
  }
  #saveState { transition: color 0.3s; }
  .hint { color: #667; font-size: 12px; }
  #detail {
    width: 100%; max-width: 1920px; margin-top: 10px; padding: 10px 12px;
    background: #1b1e24; border: 1px solid #3a3f4a; border-radius: 6px;
    font-size: 13px; line-height: 1.6; display: none; white-space: pre;
  }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; }
  .swatch { display: inline-block; width: 12px; height: 12px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
</style>
</head>
<body>

<aside id="sessionBar">
  <div id="sessionBarHead">
    <span class="grow">sessions</span>
    <button id="sessAdd" title="Add a folder or a .MOV (native chooser)">+</button>
    <button id="sessRemove" title="Remove the selected session from this list" disabled>&minus;</button>
  </div>
  <div id="sessionList"></div>
</aside>

<div id="main">

<div id="modes"></div>

<div id="stage">
  <div id="stageInner">
    <video id="video" preload="auto"></video>
    <canvas id="overlay"></canvas>
    <canvas id="loupe"></canvas>
  </div>
  <!-- DC dot captions render here: a screen-space layer OUTSIDE #stageInner,
       so the zoom transform (and the overlay's 4K backing-store cap) never
       touch it -- text stays pixel-sharp and identical at every zoom. -->
  <canvas id="calLabelLayer" style="display:none"></canvas>
</div>

<div id="controls">
  <button id="stepBack">&larr; frame</button>
  <button id="playRev">&#9664; reverse</button>
  <button id="playPause">&#9654; play</button>
  <button id="stepFwd">frame &rarr;</button>
  <span class="hint">speed</span>
  <select id="speed">
    <option value="0.1">0.1x</option>
    <option value="0.25">0.25x</option>
    <option value="0.5">0.5x</option>
    <option value="1" selected>1x</option>
    <option value="2">2x</option>
    <option value="4">4x</option>
    <option value="8">8x</option>
    <option value="16">16x</option>
  </select>
  <span class="hint">step size (s)</span>
  <input type="number" id="stepSize" value="0.067" step="0.001" min="0.001" style="width:70px">
  <button id="loupeToggle" title="Magnifier &mdash; hover the video, scroll or +/- to zoom (z to toggle)">&#128269; loupe</button>
  <button id="unitsToggle" style="display:none">yds</button>
  <button id="calBoxesToggle" style="display:none">boxes: on</button>
  <span id="calZoomCtl" style="display:none">
    <button id="calZoomOut">&minus;</button>
    <span id="calZoomLabel" style="display:inline-block; width:44px; text-align:center;">100%</span>
    <button id="calZoomIn">+</button>
    <button id="calZoomReset">1:1</button>
    <button id="calHandToggle" title="Hand tool -- drag to reposition the zoomed view (h)">&#9995; pan</button>
  </span>
  <span id="calColorSwatches" title="Reference marker colour (dot, ring, crosshair)" style="display:none"></span>
  <span class="hint" id="modeHint"></span>
</div>

<div id="status">
  <span>t = <b id="curTime">0.00</b>s</span>
  <span>frame dets: <b id="detCount">0</b></span>
  <span id="activeLine">active: <b id="activeLabel">none</b></span>
  <span>segments: <b id="segCount">0</b></span>
  <span id="saveState">saved</span>
  <span class="legend" id="legend"></span>
</div>
<div id="hint"></div>

<div id="timeline"><div id="timelineFill"></div></div>
<div id="calFrameMarkers" style="display:none"></div>

<pre id="detail"></pre>

</div><!-- #main -->

<script>
const video = document.getElementById('video');
const overlay = document.getElementById('overlay');
const ctx = overlay.getContext('2d');
const loupe = document.getElementById('loupe');
const lctx = loupe.getContext('2d');
const calLabelLayer = document.getElementById('calLabelLayer');
const lblCtx = calLabelLayer.getContext('2d');
const LOUPE_SIZE = 240;                       // on-screen diameter (css px)
const LOUPE_DPR = window.devicePixelRatio || 1;
loupe.width = LOUPE_SIZE * LOUPE_DPR;
loupe.height = LOUPE_SIZE * LOUPE_DPR;
loupe.style.width = loupe.style.height = LOUPE_SIZE + 'px';
lctx.scale(LOUPE_DPR, LOUPE_DPR);
let loupeActive = false;
let loupeZoom = 3;
let lastLoupeClient = null;                   // last {x,y} clientX/Y seen over the overlay
const timeline = document.getElementById('timeline');
const modesEl = document.getElementById('modes');
const hintEl = document.getElementById('hint');
const detailEl = document.getElementById('detail');

const LABEL_COLORS = {
  person: '#ffff00', bicycle: '#00ffff', motorcycle: '#00ffff',
  skateboard: '#cc66ff', horse: '#cc66ff',
  car: '#00ff00', bus: '#ff3333', truck: '#ff3333',
};
const HIGHLIGHT_COLOR = '#ff33ff';        // selected/followed/flagged box, or a combo's vehicle box
const RIDER_COLOR = '#33ff99';            // a combo's matched rider box(es)
const BAD_COLOR = '#ff4444';              // false_positive highlight
const HOOD_TRUNCATION_COLOR = '#ff9900';  // hood_truncation highlight
const OTHER_TRUNCATION_COLOR = '#3399ff'; // other_truncation highlight
const DISTANCE_ANOMALY_COLOR = '#d2691e'; // distance_anomaly highlight (orangey-brown)
const DISTANCE_CALIBRATION_COLOR = '#ff3b30'; // distance_calibration reference marker -- default colour (red)

// --- Persisted UI settings ------------------------------------------------
// localStorage is only a fast synchronous first-paint cache; the server
// (/api/settings, a small user-global JSON file) is the source of truth,
// because this webview drops localStorage between sessions -- which is why
// a pure-localStorage version kept "forgetting" the units toggle. Writes
// go to both; on load the server value wins.
function lsGet(k, dflt) { try { const v = localStorage.getItem(k); return v == null ? dflt : v; } catch (_) { return dflt; } }
function lsSet(k, v) { try { localStorage.setItem(k, String(v)); } catch (_) {} }
function settingSave(obj) {
  for (const [k, v] of Object.entries(obj)) lsSet('superTool.' + k, v);
  fetch('/api/settings', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(obj),
  }).catch(() => {});
}
// Reconcile the synchronously-loaded localStorage cache with the server
// copy (authoritative). Called once, early in the load sequence -- before
// switchMode() does the first render.
function applyServerSettings(s) {
  if (!s || typeof s !== 'object') return;
  if (typeof s.useMetricDistance === 'boolean') {
    useMetricDistance = s.useMetricDistance;
    lsSet('superTool.useMetricDistance', useMetricDistance);
    const btn = document.getElementById('unitsToggle');
    if (btn) btn.textContent = useMetricDistance ? 'm' : 'yds';
  }
  if (CAL_MARKER_COLORS.includes(s.calMarkerColor)) {
    calMarkerColor = s.calMarkerColor;
    lsSet('superTool.calMarkerColor', calMarkerColor);
    if (typeof renderCalSwatches === 'function') renderCalSwatches();
  }
  if (Number.isFinite(s.calZoom)) { calZoom = Math.max(1, Math.min(16, s.calZoom)); lsSet('superTool.calZoom', calZoom); }
  if (Number.isFinite(s.calPanX)) { calPanX = s.calPanX; lsSet('superTool.calPanX', calPanX); }
  if (Number.isFinite(s.calPanY)) { calPanY = s.calPanY; lsSet('superTool.calPanY', calPanY); }
}

// User-chosen colour for the distance_calibration marker -- dot, ring and
// crosshair are all drawn in this one colour. Chosen from a fixed palette,
// persisted across reloads.
const CAL_MARKER_COLORS = ['black', 'white', 'cyan', 'magenta', 'yellow', 'red', 'green', 'blue', 'orange'];
const CAL_COLOR_RGB = {
  black: [0, 0, 0], white: [255, 255, 255], cyan: [0, 255, 255], magenta: [255, 0, 255],
  yellow: [255, 255, 0], red: [255, 0, 0], green: [0, 128, 0], blue: [0, 0, 255], orange: [255, 165, 0],
};
// Ring colour for the selected swatch: black on a light colour, white on a
// dark one (relative luminance, sRGB coefficients).
function ringForColor(name) {
  const [r, g, b] = CAL_COLOR_RGB[name] || [255, 0, 0];
  return (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255 > 0.5 ? '#000' : '#fff';
}
let calMarkerColor = lsGet('superTool.calMarkerColor', 'red');
if (!CAL_MARKER_COLORS.includes(calMarkerColor)) calMarkerColor = 'red';
const TRUNCATION_TYPES = ['none', 'hood', 'other'];
// Which frame/box edge(s) the 'other' truncation clips -- recorded because
// the side determines which distance term is corrupted: bottom -> row-based,
// left/right -> width-based, top -> the obliqueness aspect check. 'hood'
// already implies bottom, so sides only apply to 'other'.
const TRUNCATION_SIDES = ['left', 'right', 'top', 'bottom'];

// --- Mode registry ---------------------------------------------------
// 'flow_debug': read-only. Draws the five per-track flow-arrow vectors
// reconstruct_annotated.py's --flow-arrows computes (predicted flow,
// previous flow, raw observed rate, raw motion, tracker-smoothed motion)
// plus the HUD/leading-vehicle tint, reading a precomputed --flow-debug-
// json (falls back to plain boxes -- no vectors/HUD/distance -- when the
// server was started without one; see super_tool.py's own doc comment).
// Click a box to select it and switch into "full overlay" mode; click
// again / empty space / Esc to clear. NOT paired with segment/timeline
// labeling -- it's a diagnostic view, not a ground-truth mode.
// 'single': one clicked box = the labeled thing for this time segment
// (followed_vehicle's original behavior; false_positive/hood_truncation/
// other_truncation reuse it unchanged -- all four are just "this one
// trackID, this time range", distinguished only by highlightColor and
// where they're saved).
// 'combo': pair a "vehicle"-class box with 1+ "rider"-class boxes over a
// time range -- click the vehicle box to open/select a segment, then
// click rider boxes to attach/detach them (toggle). maxRiders is where
// the motorcycle-passenger case (2 riders, not 1) plugs in declaratively,
// same shape as the Swift ComboAssociationStrategy design this data
// eventually validates.
const MODES = {
  flow_debug: { kind: 'flow_debug', label: 'Flow Debug',
    hint: 'click a box for full overlay + details &middot; click again / empty space / Esc to clear' },
  followed_vehicle: { kind: 'single', label: 'Followed Vehicle', highlightColor: HIGHLIGHT_COLOR,
    hint: 'click a box to follow it &middot; click the highlighted box to trim start/end or add a note' },
  false_positive: { kind: 'single', label: 'False Positive', highlightColor: BAD_COLOR,
    hint: 'click any box to flag it as a spurious detection &middot; click the highlighted box to trim start/end or add a note' },
  hood_truncation: { kind: 'single', label: 'Hood Truncation', highlightColor: HOOD_TRUNCATION_COLOR,
    hint: 'click a box the instant OUR hood/dashboard starts clipping its bottom edge &middot; click the highlighted box to trim start/end or add a note' },
  other_truncation: { kind: 'single', label: 'Other Truncation', highlightColor: OTHER_TRUNCATION_COLOR,
    hint: 'click a box the instant anything else (another object, frame edge) starts clipping it &middot; click the highlighted box to trim start/end or add a note' },
  distance_calibration: { kind: 'distance_calibration', label: 'Distance Calibration', highlightColor: DISTANCE_CALIBRATION_COLOR,
    hint: 'click anywhere to drop a reference dot and enter its tape-measured distance &middot; click a dot to select it, then arrow keys nudge 0.5px (Shift 5px) &middot; each dot shows tape "actual" vs the row-based "calc" &middot; &plus;/&minus;/1:1 or &#8984;-scroll to zoom, hand tool (h) or plain scroll to pan &middot; "boxes" toggles the detection boxes' },
  distance_anomaly: { kind: 'distance_anomaly', label: 'Distance Anomaly', highlightColor: DISTANCE_ANOMALY_COLOR,
    hint: 'click a box the instant its shown distance looks wrong to log a one-frame anomaly &middot; click a logged (highlighted) box on that frame to set true distance (tape or eyeball), truncation (+ edges, when "other"), a note, or delete it &middot; pick a representative set, not every bad frame' },
  cyclist: { kind: 'combo', label: 'Cyclist', vehicleLabel: 'bicycle', riderLabel: 'person', maxRiders: 1,
    hint: 'click a bicycle to start/select a pairing, then click its rider &middot; click a rider again to unpair &middot; click the selected vehicle box again to trim/add a note' },
  motorcyclist: { kind: 'combo', label: 'Motorcyclist', vehicleLabel: 'motorcycle', riderLabel: 'person', maxRiders: 2,
    hint: 'click a motorcycle to start/select a pairing, then click up to 2 riders (driver + passenger) &middot; click the selected vehicle box again to trim/add a note' },
  skateboarder: { kind: 'combo', label: 'Skateboarder', vehicleLabel: 'skateboard', riderLabel: 'person', maxRiders: 1,
    hint: 'click a skateboard to start/select a pairing, then click its rider &middot; click the selected vehicle box again to trim/add a note' },
  equestrian: { kind: 'combo', label: 'Equestrian', vehicleLabel: 'horse', riderLabel: 'person', maxRiders: 1,
    hint: 'click a horse to start/select a pairing, then click its rider &middot; click the selected vehicle box again to trim/add a note' },
};
const MODE_ORDER = ['flow_debug', 'followed_vehicle', 'false_positive', 'hood_truncation', 'other_truncation', 'distance_calibration', 'distance_anomaly', 'cyclist', 'motorcyclist', 'skateboarder', 'equestrian'];
const GROUND_TRUTH_MODES = MODE_ORDER.filter(m => m !== 'flow_debug');
let activeMode = 'flow_debug';

// --- flow_debug-only vector/legend setup ------------------------------
// Same convention/order as reconstruct_annotated.py's --flow-arrows: cyan
// (this frame's predicted ego-motion flow), green (previous frame's), blue
// (raw observed rate), magenta (raw single-step motion), red (the
// tracker's smoothed, physically-gated motion -- solid/opaque, the one
// arrow shown by default; see tracker.py's Track.update_flow_state).
const VECTORS = [
  { key: 'flowAngular',           color: '#00ffff', label: 'predicted flow (this frame)' },
  { key: 'prevFlowAngular',       color: '#00ff00', label: 'predicted flow (previous frame)' },
  { key: 'observedRateAngular',   color: '#0000ff', label: 'observed rate (raw)' },
  { key: 'motionAngular',         color: '#ff00ff', label: 'motion (raw, single-step)' },
];
const SMOOTHED = { key: 'smoothedMotionAngular', color: '#ff0000', label: 'motion (smoothed, trust this)' };
const LEADING_TINT_COLOR = '#ffa500';

for (const v of [...VECTORS, SMOOTHED, { color: LEADING_TINT_COLOR, label: 'ALGORITHM = classify_leading/LeadingVehicleLock pick' }]) {
  const s = document.createElement('span');
  s.innerHTML = `<span class="swatch" style="background:${v.color}"></span>${v.label}`;
  document.getElementById('legend').appendChild(s);
}

// Same calibrated-camera constant as flow_model.py -- pure geometry
// (converting an already-computed angular rate to on-screen pixels), not a
// physics reimplementation; the actual flow/motion MATH all happened
// server-side in reconstruct_annotated.py and is just being read back.
const FOCAL_LENGTH_ROW_NORMALIZED = 1.322673;
function angularToPixels(u, v, frameW, frameH) {
  const aspect = frameW / frameH;
  const fRow = FOCAL_LENGTH_ROW_NORMALIZED;
  const fCol = fRow / aspect;
  return [u * fCol * frameW, v * fRow * frameH];
}
function baseCenterNormalized(d) {
  return [d.x + d.w / 2, d.y + d.h];
}
const METERS_TO_YARDS = 1.0936133;
const MPS_TO_MPH = 2.2369363;
let useMetricDistance = lsGet('superTool.useMetricDistance', 'false') === 'true';
let selectedTrackID = null;
let selectedCalPoint = null;   // distance_calibration: the clicked reference dot (for arrow-key nudging + popup)
let calPopupPoint = null;      // distance_calibration: the dot whose entry popup is currently open (its actual/calc stay hidden until "done")
let calPopupXY = null;         // where that popup was opened, so a unit toggle can re-render it in the new unit
let showCalBoxes = true;       // distance_calibration: whether detection boxes are drawn
// distance_calibration zoom/pan -- CSS transform on #stageInner (video +
// overlay together, so they stay aligned); identity (calZoom 1) in every
// other mode. The overlay's backing store stays at natural display size
// (resizeCanvas divides by calZoom), so point x/y and all geometry stay in
// unscaled image space -- only the rendered result is magnified.
// Zoom level and pan offset persist across DC visits AND page reloads --
// leaving DC for another tool and coming back restores the exact view.
let calZoom  = parseFloat(lsGet('superTool.calZoom', '1')) || 1;
let calPanX  = parseFloat(lsGet('superTool.calPanX', '0')) || 0;
let calPanY  = parseFloat(lsGet('superTool.calPanY', '0')) || 0;
let calPanDrag = null;         // {startX, startY, panX0, panY0, moved} while dragging to pan
let calHandTool = false;       // hand tool: drag repositions the zoomed view, clicks don't place dots
let suppressNextCalClick = false;  // set on mouseup after a pan drag so the trailing click doesn't drop a dot
let overlayBsScale = 1;        // overlay backing-store px per on-screen px (< 1 only when the 4K cap bites at high zoom)
// The one just-clicked reference dot that has NOT yet been moved or given a
// distance -- the only point Esc will undo. Cleared once the dot is nudged
// or a distance is entered (then it's a real point, kept through everything).
let calFreshPoint = null;

// How far past the last (or before the first) real detection entry
// video.currentTime may drift before frameAt's "nearest" lookup is treated
// as STALE rather than current -- see flow_debug_viewer's original doc
// comment (2026-08-23 real report: playing past a JSON generated for only
// part of a longer recording left frameAt silently returning the last
// frame's boxes forever afterward, looking "stuck" with no explanation).
const STALE_DATA_THRESHOLD_S = 1.0;

// --- Mode selector UI ---------------------------------------------------
for (const m of MODE_ORDER) {
  const b = document.createElement('button');
  b.className = 'modeBtn' + (m === activeMode ? ' active' : '');
  b.textContent = MODES[m].label;
  b.dataset.mode = m;
  b.addEventListener('click', () => switchMode(m));
  modesEl.appendChild(b);
}
function switchMode(m) {
  if (MODES[activeMode] && m !== activeMode) {
    // leaving a mode: drop any bare-clicked-never-touched point
    if (MODES[activeMode].kind === 'distance_anomaly') pristineAnomalyPurge(selectedTrackID);
    // NB: leaving DC does NOT discard points or reset the zoom -- both are
    // DC state we deliberately remember across visits.
    if (MODES[activeMode].kind === 'distance_calibration') hideTrimMenu();
  }
  activeMode = m;
  for (const b of modesEl.querySelectorAll('.modeBtn')) {
    b.classList.toggle('active', b.dataset.mode === m);
  }
  const cfg = MODES[m];
  document.getElementById('modeHint').innerHTML = '| ' + cfg.hint + ' &middot; keys: &larr;/&rarr; step, space play/pause, esc close menu/clear';
  const isFlowDebug = cfg.kind === 'flow_debug';
  document.getElementById('unitsToggle').style.display = '';  // every mode shows box distances now
  document.getElementById('legend').style.display = isFlowDebug ? '' : 'none';
  document.getElementById('activeLine').style.display = isFlowDebug ? 'none' : '';
  const countSpan = document.querySelector('#status span:nth-child(4)'); // "segments:" / "anomalies:"
  countSpan.style.display = isFlowDebug ? 'none' : '';
  countSpan.firstChild.textContent =
    cfg.kind === 'distance_anomaly' ? 'anomalies: '
    : cfg.kind === 'distance_calibration' ? 'points: '
    : 'segments: ';
  document.getElementById('saveState').style.display = isFlowDebug ? 'none' : '';
  document.getElementById('calBoxesToggle').style.display = (cfg.kind === 'distance_calibration') ? '' : 'none';
  document.getElementById('calZoomCtl').style.display = (cfg.kind === 'distance_calibration') ? '' : 'none';
  document.getElementById('calColorSwatches').style.display = (cfg.kind === 'distance_calibration') ? 'inline-flex' : 'none';
  document.getElementById('calHandToggle').style.display = (cfg.kind === 'distance_calibration') ? '' : 'none';
  calLabelLayer.style.display = (cfg.kind === 'distance_calibration') ? '' : 'none';
  if (cfg.kind === 'distance_calibration') {
    // re-apply the remembered zoom/pan (clamped to the current stage size)
    clampCalPan();
    applyCalZoom();          // sets the stage transform + resizes the overlay
    setCalHandTool(calHandTool);
  } else {
    // any other mode shares the same stage -- lift the DC transform so it
    // renders un-zoomed (the calZoom/calPan values themselves are kept)
    stageInner.style.transform = '';
    overlay.style.cursor = '';
    resizeCanvas();
  }
  selectedTrackID = null;      // flow_debug and distance_anomaly both use it as the "clicked box"
  selectedCalPoint = null;
  updateDetail(null);          // clear any stale detail panel from the previous mode
  draw();
  renderTimeline();
}

let frames = [];              // [{t, detections:[{trackID,label,confidence,x,y,w,h,...optional flow/distance fields}]}]
let videoResolution = null;
let videoFps = null;
let hasFlowData = false;
let store = {};                // mode -> ground-truth array (see MODES kind for shape)
for (const m of GROUND_TRUTH_MODES) store[m] = [];
let duration = 0;
let saveTimer = null;
let reverseTimer = null;
let hintTimer = null;

// --- Sessions (left rail) ------------------------------------------------
// The server holds a registry of the recordings you've pulled up; this rail
// switches the ACTIVE one in place. Per-session view state (time, mode,
// zoom/pan, selection) is snapshotted in the browser on the way out and
// restored on the way back, so toggling never loses your place.
let sessions = [];            // [{id,label,video,hasFlow}]
let activeSessionId = null;
const sessionStates = {};     // id -> {t, mode, calZoom, ...}

function snapshotSessionState() {
  if (!activeSessionId) return;
  sessionStates[activeSessionId] = {
    t: video.currentTime || 0,
    mode: activeMode,
    calZoom, calPanX, calPanY, calHandTool, showCalBoxes,
    selTrack: selectedTrackID,
    selCalIdx: selectedCalPoint ? store.distance_calibration.indexOf(selectedCalPoint) : -1,
    rate: video.playbackRate,
  };
}
function restoreSessionState(id) {
  const s = sessionStates[id] || {};
  calZoom = Number.isFinite(s.calZoom) ? s.calZoom : 1;
  calPanX = Number.isFinite(s.calPanX) ? s.calPanX : 0;
  calPanY = Number.isFinite(s.calPanY) ? s.calPanY : 0;
  calHandTool = !!s.calHandTool;
  showCalBoxes = (s.showCalBoxes === undefined) ? true : s.showCalBoxes;
  document.getElementById('calBoxesToggle').textContent = showCalBoxes ? 'boxes: on' : 'boxes: off';
  switchMode(s.mode || 'flow_debug');      // applies zoom/hand for DC, clears the transform otherwise
  selectedTrackID = (s.selTrack != null) ? s.selTrack : null;
  selectedCalPoint = (s.selCalIdx >= 0) ? (store.distance_calibration[s.selCalIdx] || null) : null;
  if (Number.isFinite(s.rate)) { video.playbackRate = s.rate; }
  const target = s.t || 0;
  const applyT = () => {
    try { video.currentTime = Math.max(0, Math.min((video.duration || target) - 0.001, target)); } catch (_) {}
    draw(); renderTimeline(); updateStatus();
  };
  if (video.readyState >= 1) applyT();
  else video.addEventListener('loadedmetadata', applyT, { once: true });
}

function sessionSubLabel(s) {
  return s.hasFlow ? '' : 'no flow-debug';
}
function renderSessionList() {
  const el = document.getElementById('sessionList');
  el.innerHTML = '';
  if (!sessions.length) {
    const d = document.createElement('div');
    d.id = 'sessionListEmpty';
    d.textContent = 'No sessions. Click + to add a folder or a .MOV.';
    el.appendChild(d);
  }
  for (const s of sessions) {
    const row = document.createElement('div');
    row.className = 'sessRow' + (s.id === activeSessionId ? ' active' : '');
    row.title = s.video;
    row.appendChild(document.createTextNode(s.label));
    const sub = sessionSubLabel(s);
    if (sub) { const e = document.createElement('span'); e.className = 'sub'; e.textContent = sub; row.appendChild(e); }
    row.addEventListener('click', () => activateSession(s.id));
    el.appendChild(row);
  }
  document.getElementById('sessRemove').disabled = sessions.length === 0;
}

async function loadActiveData({ newVideo = false } = {}) {
  if (newVideo) {
    const gotMeta = new Promise(res => {
      const h = () => { video.removeEventListener('loadedmetadata', h); res(); };
      video.addEventListener('loadedmetadata', h);
      setTimeout(res, 8000);   // don't hang forever if the stream errors
    });
    video.src = '/video?s=' + encodeURIComponent(activeSessionId || '');
    video.load();
    await gotMeta;
  }
  const [frameData, settings, ...gts] = await Promise.all([
    fetch('/api/frames', { cache: 'no-store' }).then(r => r.json()),
    fetch('/api/settings', { cache: 'no-store' }).then(r => r.json()).catch(() => ({})),
    ...GROUND_TRUTH_MODES.map(m => fetch(`/api/ground_truth/${m}`).then(r => r.json())),
  ]);
  frames = frameData.frames || [];
  videoResolution = frameData.videoResolution;
  videoFps = frameData.videoFps;
  hasFlowData = frameData.hasFlowData;
  applyServerSettings(settings);   // server wins over the localStorage first-paint cache
  for (const m of GROUND_TRUTH_MODES) store[m] = [];
  GROUND_TRUTH_MODES.forEach((m, i) => { store[m] = gts[i] || []; });
  // distance_anomaly used to be a range model; fold any legacy {start_t,end_t}
  // entries down to a single-frame point. Best-effort only.
  store.distance_anomaly = store.distance_anomaly.map(a => {
    if (a.t != null || a.start_t == null) return a;
    const { start_t, end_t, ...rest } = a;
    const fr = frameAt(start_t);
    return { ...rest, t: fr ? fr.t : start_t };
  });
  // distance_calibration: re-run the row-based "calc" against the CURRENT formula.
  for (const p of store.distance_calibration) recomputeCalPoint(p);
  if (!hasFlowData) flashHint('No flow-debug JSON for this session -- Flow Debug shows plain boxes only.');
  duration = video.duration || 0;
}

async function activateSession(id) {
  if (!id || id === activeSessionId) return;
  snapshotSessionState();
  hideTrimMenu();
  const r = await fetch('/api/sessions/activate', {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id }),
  }).then(x => x.json()).catch(() => ({ error: 'request failed' }));
  if (r.error) { flashHint('could not switch session: ' + r.error); return; }
  activeSessionId = id;
  renderSessionList();
  await loadActiveData({ newVideo: true });
  restoreSessionState(id);
}

document.getElementById('sessAdd').addEventListener('click', async () => {
  const btn = document.getElementById('sessAdd');
  btn.disabled = true;
  try {
    const r = await fetch('/api/sessions/pick_and_add', { method: 'POST' }).then(x => x.json());
    if (r.error) { flashHint('add failed: ' + r.error); return; }
    if (r.cancelled) return;
    sessions = r.sessions || sessions;
    renderSessionList();
    if (r.added && r.added.length) await activateSession(r.added[0].id);
    else flashHint('that recording is already in the list');
  } finally {
    btn.disabled = false;   // '+' is always enabled
  }
});

document.getElementById('sessRemove').addEventListener('click', async () => {
  if (!activeSessionId || !sessions.length) return;
  const removingId = activeSessionId;
  const r = await fetch('/api/sessions/remove', {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: removingId }),
  }).then(x => x.json()).catch(() => null);
  if (!r) { flashHint('remove failed'); return; }
  delete sessionStates[removingId];
  sessions = r.sessions || [];
  if (r.active) {
    activeSessionId = null;          // force activateSession to run
    await activateSession(r.active);
  } else {
    activeSessionId = null;
    frames = []; for (const m of GROUND_TRUTH_MODES) store[m] = [];
    video.removeAttribute('src'); video.load();
    renderSessionList(); draw(); renderTimeline(); updateStatus();
  }
});

(async function initSessions() {
  const r = await fetch('/api/sessions', { cache: 'no-store' })
    .then(x => x.json()).catch(() => ({ sessions: [], active: null }));
  sessions = r.sessions || [];
  activeSessionId = r.active || (sessions[0] && sessions[0].id) || null;
  renderSessionList();
  if (!activeSessionId) { flashHint('No sessions yet -- click + in the left rail to add one.'); return; }
  video.src = '/video?s=' + encodeURIComponent(activeSessionId);
  await loadActiveData();
  switchMode(activeMode);
  updateStatus();
  renderTimeline();
})();

video.addEventListener('loadedmetadata', () => {
  duration = video.duration;
  resizeCanvas();
  renderTimeline();
});
window.addEventListener('resize', resizeCanvas);
new ResizeObserver(resizeCanvas).observe(video);

function resizeCanvas() {
  // video.getBoundingClientRect() is POST-#stageInner-transform, i.e. the
  // real on-screen size (natural * calZoom). The overlay's CSS box must
  // match the video's LAYOUT box (pre-transform), so divide calZoom back
  // out for style.width/height -- the shared transform then magnifies
  // overlay and video together, keeping them aligned. The backing store,
  // though, is sized to the full ZOOMED resolution so overlay drawing
  // (boxes, captions, the calibration crosshair) stays crisp when zoomed
  // in for pixel-precise work rather than being upscaled and blurry.
  // calZoom is only actually applied to the stage while DC mode is active;
  // in any other mode the transform is cleared, so treat zoom as 1 there
  // even though the DC value is remembered.
  const z = (MODES[activeMode] && MODES[activeMode].kind === 'distance_calibration') ? (calZoom || 1) : 1;
  const r = video.getBoundingClientRect();
  overlay.style.width = Math.round(r.width / z) + 'px';
  overlay.style.height = Math.round(r.height / z) + 'px';
  // Backing store follows the zoomed on-screen size for crispness, but
  // capped -- past ~4K there's no visible gain and the canvas memory
  // (w*h*4 bytes) balloons at high zoom.
  const bsScale = Math.min(1, 4096 / Math.max(r.width, r.height, 1));
  overlayBsScale = bsScale;
  overlay.width = Math.max(1, Math.round(r.width * bsScale));
  overlay.height = Math.max(1, Math.round(r.height * bsScale));
  overlay.style.top = video.offsetTop + 'px';
  overlay.style.left = video.offsetLeft + 'px';

  // Screen-space label layer: covers #stage at 1:1 (× devicePixelRatio),
  // never scaled or capped, so DC dot captions are always pixel-sharp.
  const sb = document.getElementById('stage').getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  calLabelLayer.style.width = Math.round(sb.width) + 'px';
  calLabelLayer.style.height = Math.round(sb.height) + 'px';
  calLabelLayer.width = Math.max(1, Math.round(sb.width * dpr));
  calLabelLayer.height = Math.max(1, Math.round(sb.height * dpr));
  lblCtx.setTransform(dpr, 0, 0, dpr, 0, 0);   // draw in CSS px

  draw();
}

const stageInner = document.getElementById('stageInner');
function persistCalZoom() {
  settingSave({ calZoom, calPanX, calPanY });
}
let calPersistTimer = null;
function persistCalZoomSoon() {   // coalesce a burst of wheel/drag events into one save
  clearTimeout(calPersistTimer);
  calPersistTimer = setTimeout(persistCalZoom, 500);
}
function applyCalZoom() {
  stageInner.style.transform =
    (calZoom === 1 && !calPanX && !calPanY) ? '' : `translate(${calPanX}px, ${calPanY}px) scale(${calZoom})`;
  document.getElementById('calZoomLabel').textContent = Math.round(calZoom * 100) + '%';
  resizeCanvas();   // ResizeObserver doesn't fire on transform changes
}
// Hand tool: while active the drag repositions the zoomed view and clicks
// do NOT place/select dots (cursor shows a grab hand).
function setCalHandTool(on) {
  calHandTool = on;
  document.getElementById('calHandToggle').classList.toggle('active', on);
  if (MODES[activeMode] && MODES[activeMode].kind === 'distance_calibration') {
    overlay.style.cursor = on ? 'grab' : '';
  }
}
// Zoom keeping the image point under (clientX, clientY) fixed on screen.
function calZoomAt(clientX, clientY, factor) {
  const prev = calZoom;
  calZoom = Math.max(1, Math.min(16, calZoom * factor));
  if (calZoom === prev) return;
  const sr = document.getElementById('stage').getBoundingClientRect(); // #stage is not transformed
  const cx = clientX - sr.left, cy = clientY - sr.top;
  // image-local point (unscaled) currently under the cursor
  const lx = (cx - calPanX) / prev, ly = (cy - calPanY) / prev;
  calPanX = cx - lx * calZoom;
  calPanY = cy - ly * calZoom;
  clampCalPan();
  applyCalZoom();
  persistCalZoomSoon();
}
// Keep at least a sliver of the image on screen when panned.
function clampCalPan() {
  if (calZoom === 1) { calPanX = calPanY = 0; return; }
  const sr = document.getElementById('stage').getBoundingClientRect();
  const contentW = sr.width * calZoom, contentH = sr.height * calZoom;
  const margin = 40;
  calPanX = Math.min(margin, Math.max(sr.width - contentW - margin, calPanX));
  calPanY = Math.min(margin, Math.max(sr.height - contentH - margin, calPanY));
}
function resetCalZoom() { calZoom = 1; calPanX = calPanY = 0; applyCalZoom(); persistCalZoom(); }

// --- Binary search for the last frame with t <= currentTime ---
function frameAt(t) {
  if (frames.length === 0) return null;
  let lo = 0, hi = frames.length - 1, ans = 0;
  while (lo <= hi) {
    const mid = (lo + hi) >> 1;
    if (frames[mid].t <= t) { ans = mid; lo = mid + 1; } else { hi = mid - 1; }
  }
  return frames[ans];
}

// Shared "most-recently-created wins among ties" tie-break -- without it a
// stale open segment from earlier in the video can permanently shadow a
// correct newer one covering the same later time (found the hard way in
// followed_vehicle mode; applies identically to combo mode's vehicleTrackID
// keying).
function activeSingleAt(mode, t) {
  let best = null;
  for (const a of store[mode]) {
    if (a.start_t <= t && (a.end_t === null || t < a.end_t)) {
      if (!best || a.start_t >= best.start_t) best = a;
    }
  }
  return best;
}
function activeComboAt(mode, t) {
  let best = null;
  for (const a of store[mode]) {
    if (a.start_t <= t && (a.end_t === null || t < a.end_t)) {
      if (!best || a.start_t >= best.start_t) best = a;
    }
  }
  return best;
}
// The canonical frames[] t NEAREST to an arbitrary time -- frameAt() floors,
// but video.currentTime / seeks land a hair either side of the grid, so the
// floor can point at the wrong neighbour. Used to pin distance_anomaly
// points to a frame stably.
function snapToFrameT(t) {
  const fr = frameAt(t);
  if (!fr) return null;
  const k = frames.indexOf(fr);
  const next = frames[Math.min(k + 1, frames.length - 1)];
  return (Math.abs(t - fr.t) <= Math.abs(next.t - t)) ? fr.t : next.t;
}
// distance_anomaly is a POINT model, not a range: every annotation is pinned
// to one frame (its t is a canonical frames[] value). These are the ones on
// the frame the playhead is currently on (can be several, one per track).
function anomaliesAtFrame(rawT) {
  if (rawT == null || !frames.length) return [];
  const ft = snapToFrameT(rawT);
  return store.distance_anomaly.filter(a => a.t === ft);
}
// An annotation with no actual information -- a bare click never followed
// up. Note: picking a true-distance TYPE (tape/eyeball) without entering a
// number does NOT count as info -- only a real distance value, a real
// truncation, or a note makes the entry "real" and safe from auto-purge.
function pristineAnomaly(a) {
  return a.tape_distance_meters == null
    && a.eyeball_distance_meters == null
    && (a.truncation_type == null || a.truncation_type === 'none')
    && (!a.truncation_sides || a.truncation_sides.length === 0)
    && !a.note;
}
// Drop any pristine annotation(s) for a track, so a box that was only
// clicked (selected) and then clicked away from goes fully back to its
// virgin, unselected state -- no stored annotation, normal box colour, and
// the two-click-to-open-panel flow restored.
function pristineAnomalyPurge(trackID) {
  if (trackID == null) return;
  const arr = store.distance_anomaly;
  const kept = arr.filter(a => !(a.trackID === trackID && pristineAnomaly(a)));
  if (kept.length !== arr.length) {
    store.distance_anomaly = kept;
    postGroundTruth('distance_anomaly');
    if (MODES[activeMode].kind === 'distance_anomaly') renderTimeline();
  }
}

// --- distance_calibration: point model like distance_anomaly, but the
// "calc" number comes from the server (/api/compute_distance ->
// reconstruct_annotated.row_based_distance_meters), the one true row-based
// formula. The point stores nothing computed of its own besides a cached
// calc_distance_meters for display/offline use; every recompute goes
// through the endpoint. ---
function calPointsAtFrame(rawT) {
  if (rawT == null || !frames.length) return [];
  const ft = snapToFrameT(rawT);
  return store.distance_calibration.filter(p => p.t === ft);
}
// Undo a just-created, never-touched reference dot (the Esc gesture). Only
// calFreshPoint qualifies -- once a dot has been nudged or given a distance
// it's a real point and survives Esc, mode switches, everything.
function pristineCalPurge() {
  const p = calFreshPoint;
  calFreshPoint = null;
  if (!p || p.tape_distance_meters != null) return;
  const arr = store.distance_calibration;
  const i = arr.indexOf(p);
  if (i === -1) return;
  arr.splice(i, 1);
  if (selectedCalPoint === p) selectedCalPoint = null;
  if (calPopupPoint === p) { calPopupPoint = null; calPopupXY = null; }
  postGroundTruth('distance_calibration');
  if (MODES[activeMode].kind === 'distance_calibration') { draw(); renderTimeline(); }
}
// Row-based "calc" for a point, via the server (single source of truth).
// Fed the EXACT pitch/roll the pipeline used for that frame (added to the
// flow-debug JSON by reconstruct_annotated.py); 0 only if a pre-regen JSON
// is loaded, in which case a hint is flashed.
function recomputeCalPoint(p) {
  const fr = frameAt(p.t);
  const pitch = fr && fr.referencePitchDegrees, roll = fr && fr.referenceRollDegrees;
  if (pitch == null || roll == null) flashHint('this flow-debug JSON predates the pitch/roll fields -- calc uses 0/0; regenerate it');
  fetch('/api/compute_distance', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      row: p.y, col: p.x, aspect: (video.videoWidth || 1920) / (video.videoHeight || 1080),
      referencePitchDegrees: pitch == null ? 0 : pitch,
      referenceRollDegrees: roll == null ? 0 : roll,
    }),
  }).then(r => r.json()).then(res => {
    p.calc_distance_meters = res.distanceMeters;
    // save distance_calibration explicitly -- scheduleSave() keys off
    // activeMode, and this callback can land after a mode switch
    postGroundTruth('distance_calibration');
    if (MODES[activeMode].kind === 'distance_calibration') { draw(); renderTimeline(); }
  }).catch(() => {});
}
function drawCalPoint(p, w, h, selected, showLabels) {
  const armLen = 16;
  const gap = 6;   // clear space around the dot -- arms don't touch it
  ctx.save();
  ctx.translate(p.x * w, p.y * h);

  // Dot / ring / crosshairs are locked to the IMAGE: they scale with the
  // zoom level (calZoom), so magnifying 4x for fine placement gives a 4x
  // marker pinned to the same pixels -- not a fixed-size pointer floating
  // over a growing image. overlayBsScale folds in the backing-store cap so
  // the on-screen result is still exactly calZoom x the base size.
  ctx.save();
  const ms = calZoom * overlayBsScale;
  if (ms !== 1) ctx.scale(ms, ms);
  // Dot + crosshair are identical whether or not the point is selected --
  // always thin. The ONLY selected/unselected differentiator is the ring:
  // drawn for the selected point, absent otherwise. Colour is user-chosen
  // (calMarkerColor) and shared by all three elements.
  ctx.strokeStyle = calMarkerColor;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(-armLen, 0); ctx.lineTo(-gap, 0);
  ctx.moveTo(gap, 0);     ctx.lineTo(armLen, 0);
  ctx.moveTo(0, -armLen); ctx.lineTo(0, -gap);
  ctx.moveTo(0, gap);     ctx.lineTo(0, armLen);
  ctx.stroke();
  // 6px-diameter dot; canvas arc AAs the non-integer path
  ctx.beginPath();
  ctx.arc(0, 0, 3, 0, Math.PI * 2);
  ctx.fillStyle = calMarkerColor;
  ctx.fill();
  if (selected) {
    ctx.strokeStyle = calMarkerColor; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(0, 0, 12, 0, Math.PI * 2); ctx.stroke();
  }
  ctx.restore();
  ctx.restore();
  // The "actual"/"calc" captions are NOT drawn here -- they go on the
  // screen-space #calLabelLayer (see drawCalLabels) so they never inherit
  // the zoom transform or the overlay's 4K backing-store cap, and stay
  // pixel-sharp and identically sized at every zoom level.
}

// DC dot captions, drawn on the un-transformed screen-space layer. Each
// dot's on-screen position is derived from calPan/calZoom directly, then
// the caption is drawn at a fixed 13px so it looks the same at any zoom.
function drawCalLabels() {
  lblCtx.clearRect(0, 0, calLabelLayer.width, calLabelLayer.height);
  if (!MODES[activeMode] || MODES[activeMode].kind !== 'distance_calibration') return;
  const z = calZoom || 1;
  const Wl = overlay.clientWidth || parseFloat(overlay.style.width) || overlay.width;
  const Hl = overlay.clientHeight || parseFloat(overlay.style.height) || overlay.height;
  const armLen = 16;
  lblCtx.font = '13px monospace';
  lblCtx.textBaseline = 'alphabetic';
  for (const p of calPointsAtFrame(video.currentTime)) {
    if (p === calPopupPoint) continue;   // hidden while its entry popup is open
    // dot centre in #stage layout px, then apply the #stageInner transform
    const sx = calPanX + (video.offsetLeft + p.x * Wl) * z;
    const sy = calPanY + (video.offsetTop + p.y * Hl) * z;
    const off = armLen * z + 4;          // clear of the (zoom-scaled) crosshair
    calCaption(`actual ${p.tape_distance_meters == null ? '?' : distU(p.tape_distance_meters)}`, sx + off, sy - 6);
    calCaption(`calc ${p.calc_distance_meters == null ? '…' : distU(p.calc_distance_meters)}`, sx + off, sy + 14);
  }
}
// same black-on-translucent-white style as drawCaption, but on lblCtx
function calCaption(text, x, y) {
  const tw = lblCtx.measureText(text).width;
  const pad = 3;
  lblCtx.globalAlpha = 0.5;
  lblCtx.fillStyle = '#ffffff';
  lblCtx.fillRect(x - pad, y - 13 - pad, tw + pad * 2, 13 + pad + 4);
  lblCtx.globalAlpha = 1;
  lblCtx.fillStyle = '#000000';
  lblCtx.fillText(text, x, y);
}

function drawArrow(x0, y0, x1, y1, color) {
  const len = Math.hypot(x1 - x0, y1 - y0);
  if (len < 1) return;
  ctx.strokeStyle = color;
  ctx.fillStyle = color;
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
  const angle = Math.atan2(y1 - y0, x1 - x0);
  const headLen = 12, headAngle = 0.55;
  const p2x = x1 - headLen * Math.cos(angle - headAngle), p2y = y1 - headLen * Math.sin(angle - headAngle);
  const p3x = x1 - headLen * Math.cos(angle + headAngle), p3y = y1 - headLen * Math.sin(angle + headAngle);
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(p2x, p2y); ctx.lineTo(p3x, p3y); ctx.closePath(); ctx.fill();
}

function drawVector(d, w, h, key, color) {
  const rate = d[key];
  if (!rate) return null;
  const [bx, by] = baseCenterNormalized(d);
  const [dx, dy] = angularToPixels(rate[0], rate[1], w, h);
  const tipX = bx * w + dx, tipY = by * h + dy;
  drawArrow(bx * w, by * h, tipX, tipY, color);
  return [tipX, tipY];
}

// Real-world speed magnitude at this detection's own depth -- see
// flow_debug_viewer's original doc comment: does NOT include the object's
// closing/opening (depth-rate) component, so this UNDERSTATES true speed
// for anything moving mostly toward/away from the camera.
function smoothedSpeedMph(d) {
  const rate = d.smoothedMotionAngular;
  if (!rate || d.correctedDistanceMeters == null) return null;
  const speedMps = Math.hypot(rate[0], rate[1]) * d.correctedDistanceMeters;
  return speedMps * MPS_TO_MPH;
}

// metres -> current display unit (yds/m) with the unit spelled out. DISPLAY
// formatting only -- the row-based "calc" itself is the server-side
// row_based_distance_meters, never anything computed here.
function distU(m) {
  if (m == null) return 'null';
  return useMetricDistance ? `${m.toFixed(2)} m` : `${(m * METERS_TO_YARDS).toFixed(2)} yds`;
}

function distanceText(d) {
  if (d.correctedDistanceMeters === null || d.correctedDistanceMeters === undefined) {
    return useMetricDistance ? '? m' : '? yds';
  }
  return useMetricDistance
    ? `${d.correctedDistanceMeters.toFixed(1)} m`
    : `${(d.correctedDistanceMeters * METERS_TO_YARDS).toFixed(1)} yds`;
}

// distance_fusion.py's fused_distance_meters, added 2026-08-26 ALONGSIDE
// correctedDistanceMeters (the existing binary row/width switch), not
// replacing it -- the whole point of wiring this in is a side-by-side
// labeling pass, not a silent swap. UNRELIABLE (fused_distance_meters ===
// null) gets a distinct word, not a '?' that could be misread as "missing
// data" the way distanceText's own no-data case reads.
function fusedDistanceText(d) {
  if (d.fused_distance_meters === undefined) return null; // no --flow-debug-json fusion data at all
  if (d.fused_distance_meters === null) return 'UNRELIABLE';
  return useMetricDistance
    ? `${d.fused_distance_meters.toFixed(1)} m`
    : `${(d.fused_distance_meters * METERS_TO_YARDS).toFixed(1)} yds`;
}

// True when the two distances disagree enough to be worth flagging in the
// compact box caption (not just in the detail panel) -- 15% relative,
// picked to surface real divergences without flagging routine sub-percent
// noise on every box in frame.
function distancesDisagree(d) {
  if (d.correctedDistanceMeters == null || d.fused_distance_meters == null) return false;
  return Math.abs(d.fused_distance_meters - d.correctedDistanceMeters) / d.correctedDistanceMeters > 0.15;
}

// Best available distance estimate for a detection (metres), or null --
// the fused value first, then the existing row/width switch value.
function bestDistanceMeters(d) {
  for (const v of [d.fused_distance_meters, d.correctedDistanceMeters]) {
    if (typeof v === 'number' && isFinite(v)) return v;
  }
  return null;
}
// Detections ordered farthest-first so nearer boxes paint last and sit on
// top in the canvas Z-order. Real distance estimate where we have one;
// otherwise the box's bottom edge as a monocular proxy (lower on screen =
// nearer), for the live-tracking fallback with no --flow-debug-json. The
// clicked/selected box is still lifted above this ordering by its branch.
function farToNear(dets) {
  const farness = d => bestDistanceMeters(d) ?? (1 - (d.y + d.h)) * 100;
  return dets.slice().sort((a, b) => farness(b) - farness(a));
}

// Black-on-white caption on a translucent backing, same as
// draw_label_text in reconstruct_annotated.py.
function drawCaption(text, x, y) {
  ctx.font = '13px monospace';
  const tw = ctx.measureText(text).width;
  const pad = 3;
  ctx.globalAlpha = 0.5;
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(x - pad, y - 13 - pad, tw + pad * 2, 13 + pad + 4);
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#000000';
  ctx.fillText(text, x, y);
}

function drawLeadingTint(d, w, h) {
  const x = d.x * w, y = d.y * h, bw = d.w * w, bh = d.h * h;
  ctx.globalAlpha = 0.35;
  ctx.fillStyle = LEADING_TINT_COLOR;
  ctx.fillRect(x, y, bw, bh);
  ctx.globalAlpha = 1;
  ctx.strokeStyle = LEADING_TINT_COLOR;
  ctx.lineWidth = 3;
  ctx.strokeRect(x, y, bw, bh);
  drawCaption('ALGORITHM', x + 4, y + bh + 18);
}

// Same fields/leading text as draw_hud's on-screen HUD in
// reconstruct_annotated.py, itself mirroring the live on-device app's own
// HUD labels. Only meaningful when a --flow-debug-json was loaded (its
// per-frame entries carry thermal/resolution/model/etc.) -- the live
// geometry-tracker fallback frames have none of these fields, so this
// simply draws nothing extra in that mode.
function drawHud(f, w, h) {
  ctx.font = '16px monospace';
  if (f.thermal) {
    const stateText = f.thermal.state === 'nominal' ? 'OK' : f.thermal.state.toUpperCase();
    let color = '#bfbfbf';
    if (f.thermal.state === 'fair') color = '#ffd700';
    else if (f.thermal.state === 'serious' || f.thermal.state === 'critical') color = '#ff0000';
    ctx.fillStyle = color;
    ctx.fillText(`thermal: ${stateText} ${f.thermal.percent}%`, 12, 26);
  }
  if (f.resolution) {
    ctx.fillStyle = '#bfbfbf';
    if (videoResolution) ctx.fillText(`video: ${videoResolution}`, 12, h - 56);
    ctx.fillText(`res: ${f.resolution}`, 12, h - 34);
    ctx.fillText(`model: ${f.model}`, 12, h - 12);

    const lowState = f.lowLightEnabled ? 'on' : 'off';
    const lowText = f.autoLowLightEnabled ? `low-light: auto (${lowState})` : `low-light: ${lowState}`;
    ctx.fillText(lowText, w - ctx.measureText(lowText).width - 12, h - 12);

    const stabText = `stabilization: ${f.stabilizationEnabled ? 'on' : 'off'}`;
    ctx.fillText(stabText, w - ctx.measureText(stabText).width - 12, 26);
  }

  if (videoFps) {
    const frameIndex = Math.round(video.currentTime * videoFps);
    const text = `frame ${frameIndex}`;
    const tw = ctx.measureText(text).width;
    drawCaption(text, w - tw - 12 - 3, 26 + 40);
  }
}

function updateDetail(d) {
  if (!d) { detailEl.style.display = 'none'; return; }
  const fmt = (v) => v ? `(${v[0].toFixed(4)}, ${v[1].toFixed(4)})` : 'null';
  const fmtNum = (v, digits) => v == null ? 'null' : v.toFixed(digits);
  detailEl.style.display = 'block';
  let text =
    `#${d.trackID} ${d.label}  conf=${(d.confidence * 100).toFixed(1)}%\n` +
    `corrected (existing switch) = ${distU(d.correctedDistanceMeters)}` +
    `   widthOverridden = ${d.widthOverridden}\n`;
  // distance_fusion.py's breakdown -- only present when a --flow-debug-json
  // was loaded with the fusion fields (added 2026-08-26); the live-
  // tracking fallback has none of this.
  if (d.fused_distance_meters !== undefined) {
    text +=
      `fused (NEW)          = ${distU(d.fused_distance_meters)}` +
      `   sigma = ${distU(d.fused_sigma_meters)}\n` +
      `  row:   dist=${distU(d.row_distance_meters)}  sigma=${distU(d.row_sigma_meters)}` +
      `  phi=${fmtNum(d.phi_degrees, 2)}deg  p_truncated=${d.p_truncated == null ? 'null' : d.p_truncated.toExponential(2)}\n` +
      `  width: dist=${distU(d.width_distance_meters)}  sigma=${distU(d.width_sigma_meters)}\n` +
      `  terms_used=${d.terms_used ? d.terms_used.join('+') : 'none'}` +
      `  side_truncated=${d.side_truncated}\n`;
  }
  text +=
    `box = x=${d.x.toFixed(4)} y=${d.y.toFixed(4)} w=${d.w.toFixed(4)} h=${d.h.toFixed(4)}  aspect(w/h)=${(d.w / d.h).toFixed(3)}\n` +
    `flowAngular (cyan)          = ${fmt(d.flowAngular)}\n` +
    `prevFlowAngular (green)     = ${fmt(d.prevFlowAngular)}\n` +
    `observedRateAngular (blue)  = ${fmt(d.observedRateAngular)}\n` +
    `motionAngular (magenta, raw)     = ${fmt(d.motionAngular)}\n` +
    `smoothedMotionAngular (red, trust) = ${fmt(d.smoothedMotionAngular)}`;
  detailEl.textContent = text;
}

function drawFlowDebug(f, w, h) {
  const dataGap = video.currentTime - f.t;
  if (Math.abs(dataGap) > STALE_DATA_THRESHOLD_S) {
    const msg = 'No data';
    ctx.font = 'bold 18px monospace';
    const tw = ctx.measureText(msg).width;
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(w / 2 - tw / 2 - 10, h / 2 - 20, tw + 20, 34);
    ctx.fillStyle = '#ff4444';
    ctx.fillText(msg, w / 2 - tw / 2, h / 2 + 4);
    updateDetail(null);
    return;
  }

  // Draw everything else first, then the selected box last, so clicking a
  // box lifts its rectangle / caption / vectors to the front of the canvas
  // Z-order instead of leaving them buried under an overlapping neighbour.
  const drawOne = (d, isSelected) => {
    const isLeading = f.lockedLeadingTrackID != null && d.trackID === f.lockedLeadingTrackID;
    // "#id label dist" caption when distance data is available (a
    // --flow-debug-json was loaded); plain "#id label conf%" caption in
    // the live-tracking-fallback case, matching label_leading_vehicle's
    // original box caption for that data shape. Fused distance appended
    // when present (added 2026-08-26) -- old value stays first/primary so
    // this reads as an addition, not a replacement; only shown alongside
    // when it MEANINGFULLY disagrees, so an ordinary frame full of boxes
    // that already agree doesn't turn into visual noise.
    const fusedText = fusedDistanceText(d);
    const isUnreliable = fusedText === 'UNRELIABLE';
    let caption = hasFlowData
      ? `#${d.trackID} ${d.label} ${distanceText(d)}`
      : `#${d.trackID} ${d.label} ${Math.round(d.confidence * 100)}%`;
    if (fusedText !== null && (isUnreliable || distancesDisagree(d))) {
      caption += ` | fused: ${fusedText}`;
    }
    const x = d.x * w, y = d.y * h;
    // Distinct warning color when fusion has given up on this box entirely
    // (fused_distance_meters === null) -- a real, visible signal rather
    // than something buried in text a reviewer has to read every caption
    // to notice.
    ctx.strokeStyle = isUnreliable ? '#ff9900' : (isSelected ? '#ffffff' : (LABEL_COLORS[d.label] || '#888888'));
    ctx.lineWidth = isSelected ? 3 : (isUnreliable ? 2.5 : 1.5);
    ctx.strokeRect(x, y, d.w * w, d.h * h);
    drawCaption(caption, x + 4, y + 18);
    if (isLeading) drawLeadingTint(d, w, h);
    if (isSelected && hasFlowData) {
      for (const v of VECTORS) drawVector(d, w, h, v.key, v.color);
    }
    if (hasFlowData) {
      const tip = drawVector(d, w, h, SMOOTHED.key, SMOOTHED.color);
      if (tip) {
        const mph = smoothedSpeedMph(d);
        if (mph !== null) drawCaption(`${mph.toFixed(1)} mph`, tip[0] + 6, tip[1] + 4);
      }
    }
  };

  let selectedDet = null;
  for (const d of farToNear(f.detections)) {
    if (d.trackID !== null && d.trackID === selectedTrackID) { selectedDet = d; continue; }
    drawOne(d, false);
  }
  if (selectedDet) drawOne(selectedDet, true);
  if (hasFlowData) drawHud(f, w, h);
  updateDetail(selectedDet);
}

function draw() {
  ctx.clearRect(0, 0, overlay.width, overlay.height);
  drawCalLabels();   // screen-space DC captions; self-clears / no-ops outside DC mode
  const f = frameAt(video.currentTime);
  const cfg = MODES[activeMode];
  if (!f) { updateStatus(f); renderPlayhead(); return; }
  const w = overlay.width, h = overlay.height;

  if (cfg.kind === 'flow_debug') {
    drawFlowDebug(f, w, h);
    updateStatus(f);
  } else if (cfg.kind === 'distance_anomaly') {
    const anns = anomaliesAtFrame(video.currentTime);
    const annByTrack = new Map(anns.map(a => [a.trackID, a]));
    const marked = new Set(anns.map(a => a.trackID));
    let selDet = null;
    for (const d of farToNear(f.detections)) {
      if (d.trackID === selectedTrackID) { selDet = d; continue; }        // drawn last, below
      const extra = daTrueDistSuffix(annByTrack.get(d.trackID));           // " (tape: 10.3 m)" once entered
      if (marked.has(d.trackID)) drawBox(d, w, h, cfg.highlightColor, 1.5, false, extra);  // logged here, not selected -- subtle marker
      else drawBox(d, w, h, LABEL_COLORS[d.label] || '#ffffff', 2, false, extra);
    }
    if (selDet) drawBox(selDet, w, h, cfg.highlightColor, 4, true, daTrueDistSuffix(annByTrack.get(selDet.trackID)));  // the one clicked box -- prominent, on top
    updateStatus(f, anns);
    updateDetail(f.detections.find(d => d.trackID === selectedTrackID) || null);
  } else if (cfg.kind === 'distance_calibration') {
    if (showCalBoxes) {
      for (const d of farToNear(f.detections)) drawBox(d, w, h, LABEL_COLORS[d.label] || '#ffffff', 2, false);
    }
    // dots + their captions drawn last -> always highest in the Z-order
    for (const p of calPointsAtFrame(video.currentTime)) drawCalPoint(p, w, h, p === selectedCalPoint, p !== calPopupPoint);
    updateStatus(f, selectedCalPoint);
    updateDetail(null);
  } else if (cfg.kind === 'single') {
    const active = activeSingleAt(activeMode, video.currentTime);
    let activeDet = null;
    for (const d of farToNear(f.detections)) {
      if (active && d.trackID === active.trackID) { activeDet = d; continue; }
      drawBox(d, w, h, LABEL_COLORS[d.label] || '#ffffff', 2, false);
    }
    // selected/labeled box drawn last -> on top of overlapping neighbours
    if (activeDet) drawBox(activeDet, w, h, cfg.highlightColor, 4, true);
    updateStatus(f, active);
  } else {
    const active = activeComboAt(activeMode, video.currentTime);
    let vehicleBox = null;
    const riderBoxes = [];
    for (const d of farToNear(f.detections)) {
      const isVehicle = active && d.label === cfg.vehicleLabel && d.trackID === active.vehicleTrackID;
      const isRider = active && d.label === cfg.riderLabel && active.riderTrackIDs.includes(d.trackID);
      if (isVehicle) { vehicleBox = d; continue; }
      if (isRider) { riderBoxes.push(d); continue; }
      drawBox(d, w, h, LABEL_COLORS[d.label] || '#ffffff', 2, false);
    }
    // Connecting lines make the pairing legible in crowded frames (several
    // people/bikes at once) where color alone is ambiguous.
    if (vehicleBox && riderBoxes.length) {
      const vx = (vehicleBox.x + vehicleBox.w / 2) * w, vy = (vehicleBox.y + vehicleBox.h / 2) * h;
      ctx.strokeStyle = RIDER_COLOR;
      ctx.lineWidth = 2;
      ctx.setLineDash([5, 4]);
      for (const r of riderBoxes) {
        const rx = (r.x + r.w / 2) * w, ry = (r.y + r.h / 2) * h;
        ctx.beginPath(); ctx.moveTo(vx, vy); ctx.lineTo(rx, ry); ctx.stroke();
      }
      ctx.setLineDash([]);
    }
    // the paired vehicle + riders drawn last -> on top of neighbours and link lines
    if (vehicleBox) drawBox(vehicleBox, w, h, HIGHLIGHT_COLOR, 4, true);
    for (const r of riderBoxes) drawBox(r, w, h, RIDER_COLOR, 4, true);
    updateStatus(f, active);
  }
  renderPlayhead();
  if (loupeActive) updateLoupe();
}

function drawBox(d, w, h, color, lineWidth, filled, captionExtra) {
  const x = d.x * w, y = d.y * h, bw = d.w * w, bh = d.h * h;
  ctx.strokeStyle = color;
  ctx.lineWidth = lineWidth;
  ctx.strokeRect(x, y, bw, bh);
  if (filled) {
    ctx.fillStyle = color + '55';
    ctx.fillRect(x, y, bw, bh);
  }
  // distance (unit-toggle aware), black on translucent white -- same caption
  // style as Flow Debug mode and reconstruct_annotated.py's draw_label_text.
  // (Regressed to a coloured "conf%" in the 4236e93 flow_debug_viewer merge;
  // the pre-merge drawBox already showed distanceText via drawCaption.)
  // captionExtra: DA mode appends the entered true distance, e.g. " (tape: 10.3 m)".
  drawCaption(`#${d.trackID} ${d.label} ${distanceText(d)}${captionExtra || ''}`, x + 4, y + 18);
}
// " (tape: 10.3 m)" / " (eyeball: 25.0 m)" for the DA box label once a real
// true-distance value has been entered for this track on this frame.
// Unit-toggle aware; empty when there's nothing to show.
function daTrueDistSuffix(a) {
  if (!a) return '';
  const fmt = m => useMetricDistance ? `${m.toFixed(1)} m` : `${(m * METERS_TO_YARDS).toFixed(1)} yds`;
  if (a.tape_distance_meters != null)    return ` (tape: ${fmt(a.tape_distance_meters)})`;
  if (a.eyeball_distance_meters != null) return ` (eyeball: ${fmt(a.eyeball_distance_meters)})`;
  return '';
}

function updateStatus(f, active) {
  document.getElementById('curTime').textContent = video.currentTime.toFixed(2);
  document.getElementById('detCount').textContent = f ? f.detections.length : 0;
  const cfg = MODES[activeMode];
  if (cfg.kind === 'flow_debug') return;
  let label = 'none';
  if (cfg.kind === 'distance_anomaly') {
    const anns = active || [];          // updateStatus is passed the array for this mode
    if (anns.length === 1) {
      const a = anns[0];
      label = `#${a.trackID} (${anomalyTrueDistText(a)}, ${anomalyTruncText(a)})` + (a.note ? ` (note: ${a.note})` : '');
    } else if (anns.length > 1) {
      label = anns.map(a => '#' + a.trackID).join(', ') + ` — ${anns.length} anomalies on this frame`;
    }
  } else if (cfg.kind === 'distance_calibration') {
    if (active) {   // the selected point
      let err = '';
      if (active.tape_distance_meters != null && active.calc_distance_meters != null) {
        const pct = 100 * (active.calc_distance_meters - active.tape_distance_meters) / active.tape_distance_meters;
        err = `  err ${pct >= 0 ? '+' : ''}${pct.toFixed(1)}%`;
      }
      label = `actual ${distU(active.tape_distance_meters)}  calc ${distU(active.calc_distance_meters)}${err}`;
    }
  } else if (active) {
    if (cfg.kind === 'single') {
      label = '#' + active.trackID;
    } else {
      const riders = active.riderTrackIDs.length ? active.riderTrackIDs.map(id => '#' + id).join(', ') : 'none yet';
      label = `vehicle #${active.vehicleTrackID} — riders: ${riders}`;
    }
    if (active.note) label += ` (note: ${active.note})`;
  }
  document.getElementById('activeLabel').textContent = label;
  document.getElementById('segCount').textContent = store[activeMode].length;
}

function flashHint(msg) {
  hintEl.textContent = msg;
  clearTimeout(hintTimer);
  hintTimer = setTimeout(() => { hintEl.textContent = ''; }, 1800);
}

// --- Click to add / trim / delete / pair / select ---
function hitTestBox(e) {
  const rect = overlay.getBoundingClientRect();
  // Pixel space, not normalized -- a fixed padding/tolerance in normalized
  // coordinates shrinks to almost nothing on screen for small/distant
  // vehicles (found via real failure reports: a 1.3%x1.6%-of-frame box was
  // simply too small a target to hit at the old 0.03 normalized tolerance).
  // Padding in actual pixels keeps small boxes comfortably clickable
  // regardless of the video's displayed zoom level.
  const px = e.clientX - rect.left, py = e.clientY - rect.top;
  // Combo mode's two boxes (rider + vehicle) are typically small and
  // tightly overlapping (a person on a bike, not two separated cars) --
  // confirmed via testing that the original 10px pad, tuned for picking
  // one of several well-separated vehicles, can swallow almost the entire
  // smaller box's own footprint when both boxes are this close together,
  // making the rider effectively unclickable except in a sliver a couple
  // pixels tall. Single-select/flow-debug modes keep the original tuning.
  const PAD_PX = MODES[activeMode].kind === 'combo' ? 4 : 10;
  const FALLBACK_PX = 25;
  const f = frameAt(video.currentTime);
  if (!f || Math.abs(video.currentTime - f.t) > STALE_DATA_THRESHOLD_S) return { box: null, rect };

  // Prefer smallest-area box (padded) containing the click; fall back to
  // nearest center within a pixel-space tolerance.
  let best = null, bestArea = Infinity;
  for (const d of f.detections) {
    const bx = d.x * rect.width, by = d.y * rect.height;
    const bw = d.w * rect.width, bh = d.h * rect.height;
    if (px >= bx - PAD_PX && px <= bx + bw + PAD_PX && py >= by - PAD_PX && py <= by + bh + PAD_PX) {
      const area = bw * bh;
      if (area < bestArea) { bestArea = area; best = d; }
    }
  }
  if (!best) {
    let bestDist = FALLBACK_PX;
    for (const d of f.detections) {
      const cx = (d.x + d.w / 2) * rect.width, cy = (d.y + d.h / 2) * rect.height;
      const dist = Math.hypot(px - cx, py - cy);
      if (dist < bestDist) { bestDist = dist; best = d; }
    }
  }
  return { box: best, rect };
}

overlay.addEventListener('click', (e) => {
  const cfg = MODES[activeMode];

  if (cfg.kind === 'flow_debug') {
    const { box: best } = hitTestBox(e);
    if (!best || best.trackID === null) {
      selectedTrackID = null;
    } else if (best.trackID === selectedTrackID) {
      selectedTrackID = null;
    } else {
      selectedTrackID = best.trackID;
      // Selecting is for frame-by-frame inspection, not for watching
      // playback continue -- pause so the next natural action is stepping.
      video.pause(); setPlayPauseLabel();
    }
    draw();
    return;
  }

  // Dismiss any stale trim menu, but don't swallow the click -- it should
  // still act on whatever box is under the cursor in the same click. (The
  // menu's own buttons live outside #overlay in the DOM, so clicks on them
  // never reach this listener at all -- this only ever fires for clicks on
  // the video/overlay itself.) Previously this returned early on any click
  // while a menu was open, which meant a leftover menu silently ate the
  // next click entirely -- the real cause of "takes two clicks" reports.
  hideTrimMenu();

  if (cfg.kind === 'distance_calibration') {
    // a pan drag ends with a click event -- ignore that one so panning the
    // zoomed image never leaves a stray dot behind
    if (suppressNextCalClick) { suppressNextCalClick = false; return; }
    // hand tool active -> this click is for panning, not placing dots
    if (calHandTool) return;
    // any point on the image is a valid reference mark -- detection boxes
    // are irrelevant here, so this runs BEFORE hitTestBox.
    if (!frames.length) return;
    const rect = overlay.getBoundingClientRect();
    const px = e.clientX - rect.left, py = e.clientY - rect.top;
    const ft = snapToFrameT(video.currentTime);
    // near an existing dot on this frame -> select it (for arrow-nudge);
    // clicking the already-selected dot reopens its distance popup. The
    // threshold is in on-screen px and rect.width is post-zoom, so scale it
    // by calZoom -- otherwise a 4x-magnified crosshair has the same tiny
    // 10px hit target it had at 1x, and clicking the (visibly huge) marker
    // misses and drops a spurious new dot instead of selecting it.
    let near = null, nd = Infinity;
    for (const p of store.distance_calibration) {
      if (p.t !== ft) continue;
      const d = Math.hypot(p.x * rect.width - px, p.y * rect.height - py);
      if (d < nd) { nd = d; near = p; }
    }
    if (near && nd <= 10 * (calZoom || 1)) {
      if (near === selectedCalPoint) {
        showTrimMenu(e.clientX, e.clientY, store.distance_calibration, near, ft);
        calPopupPoint = near; calPopupXY = { x: e.clientX, y: e.clientY };
      } else {
        selectedCalPoint = near;
      }
      draw();
      return;
    }
    // empty space -> drop a new dot here and open its distance popup
    pristineCalPurge();   // discard any earlier dot left uncommitted
    const p = { x: px / rect.width, y: py / rect.height, t: ft, tape_distance_meters: null, calc_distance_meters: null };
    store.distance_calibration.push(p);
    selectedCalPoint = p;
    calFreshPoint = p;    // Esc can still undo this one until it's moved/committed
    scheduleSave(); renderTimeline();
    recomputeCalPoint(p);
    showTrimMenu(e.clientX, e.clientY, store.distance_calibration, p, ft);
    calPopupPoint = p; calPopupXY = { x: e.clientX, y: e.clientY };
    draw();
    return;
  }

  const { box: best } = hitTestBox(e);
  if (!best) {
    if (cfg.kind === 'distance_anomaly' && selectedTrackID !== null) {
      pristineAnomalyPurge(selectedTrackID); selectedTrackID = null; draw();
    }
    return;
  }
  const t = video.currentTime;

  if (cfg.kind === 'distance_anomaly') {
    // POINT model: one annotation per (track, frame). FIRST click on a box
    // just SELECTS it (highlight + data in #detail); it's still virgin --
    // no annotation stored. SECOND click on the selected box opens the
    // panel, creating the annotation for this frame if it doesn't exist.
    // Clicking away (empty space / another box / Esc) deselects and drops a
    // never-touched annotation, so the box is fully virgin again.
    if (!frames.length) return;
    const arr = store[activeMode];
    if (best.trackID !== selectedTrackID) {
      pristineAnomalyPurge(selectedTrackID);
      selectedTrackID = best.trackID;
      draw();
      return;
    }
    const ft = snapToFrameT(video.currentTime);
    let ann = arr.find(a => a.trackID === best.trackID && a.t === ft);
    if (!ann) {
      ann = {
        t: ft, trackID: best.trackID,
        true_distance_type: null,        // 'tape' | 'eyeball' | null -- only one may be set
        tape_distance_meters: null,      // measured, metres
        eyeball_distance_meters: null,   // judged by eye, metres
        truncation_type: 'none',
        truncation_sides: [],            // subset of TRUNCATION_SIDES, only for truncation_type === 'other'
      };
      arr.push(ann);
      scheduleSave(); renderTimeline();
    }
    showTrimMenu(e.clientX, e.clientY, arr, ann, ft);
    draw();
    return;
  }

  if (cfg.kind === 'single') {
    const arr = store[activeMode];
    const active = activeSingleAt(activeMode, t);
    if (active && active.trackID === best.trackID) {
      // Clicked the currently-highlighted box: offer to trim from either
      // end, frame-by-frame.
      showTrimMenu(e.clientX, e.clientY, arr, active, t);
    } else {
      // Clicked a different box: implicitly end any open assignment now,
      // start a new one.
      if (active && active.end_t === null) active.end_t = t;
      arr.push({ start_t: t, end_t: null, trackID: best.trackID });
      scheduleSave(); draw(); renderTimeline();
    }
    return;
  }

  // combo mode
  const arr = store[activeMode];
  const active = activeComboAt(activeMode, t);

  if (best.label === cfg.vehicleLabel) {
    if (active && active.vehicleTrackID === best.trackID) {
      showTrimMenu(e.clientX, e.clientY, arr, active, t);
    } else {
      if (active && active.end_t === null) active.end_t = t;
      arr.push({ start_t: t, end_t: null, vehicleTrackID: best.trackID, riderTrackIDs: [] });
      scheduleSave(); draw(); renderTimeline();
    }
  } else if (best.label === cfg.riderLabel) {
    if (!active) { flashHint(`click a ${cfg.vehicleLabel} first to start a pairing`); return; }
    const idx = active.riderTrackIDs.indexOf(best.trackID);
    if (idx >= 0) {
      active.riderTrackIDs.splice(idx, 1);
    } else if (active.riderTrackIDs.length < cfg.maxRiders) {
      active.riderTrackIDs.push(best.trackID);
    } else {
      flashHint(`already at max ${cfg.maxRiders} rider(s) for this pairing`);
      return;
    }
    scheduleSave(); draw(); renderTimeline();
  }
  // else: clicked a box that's neither this mode's vehicle nor rider label -- ignore.
});

// --- Trim menu: appears at the click point when clicking the currently-
// highlighted (single mode) or selected-vehicle (combo mode) box, offering
// to cut the segment from either end at the current frame. Snipping a
// boundary past the other one removes the segment entirely rather than
// leaving something inverted/empty. Generic over which array/item it
// operates on so both single and combo modes share it.
let trimMenuEl = null;
let trimMenuDismiss = null;

// One-line "true distance" summary for a distance_anomaly annotation,
// shared by the status line and the timeline tooltip. tape (measured) and eyeball
// (judged by eye) are kept strictly separate so they can't be mistaken for
// one another, but both are just a distance in metres.
function anomalyTrueDistText(a) {
  if (a.true_distance_type === 'tape' && a.tape_distance_meters != null) {
    return `tape ${a.tape_distance_meters.toFixed(1)}m`;
  }
  if (a.true_distance_type === 'eyeball' && a.eyeball_distance_meters != null) {
    return `eyeball ${a.eyeball_distance_meters.toFixed(1)}m`;
  }
  return 'true dist: ?';
}
// "trunc:<type>" for the status line / tooltip, with the clipped edges
// appended for the 'other' case, e.g. "trunc:other[left,bottom]".
function anomalyTruncText(a) {
  const sides = (a.truncation_type === 'other' && Array.isArray(a.truncation_sides) && a.truncation_sides.length)
    ? `[${a.truncation_sides.join(',')}]` : '';
  return `trunc:${a.truncation_type}${sides}`;
}

// The label panel that opens when you click an already-highlighted box.
// Everything is inline (buttons + real <input>/<select>s) -- window.prompt
// /confirm are NOT available here: super_tool runs inside the desktop
// app's embedded webview, where prompt() throws "not supported". Fields
// that don't close the panel (selects, number entry) leave it open so you
// can step a frame and adjust again; trim start/end finish the interaction
// and close it. Dismiss with "done", Escape, an outside click, or by
// clicking another box.
function showTrimMenu(clientX, clientY, arr, item, t) {
  hideTrimMenu();
  const isAnomaly = MODES[activeMode].kind === 'distance_anomaly';
  const isCal = MODES[activeMode].kind === 'distance_calibration';
  trimMenuEl = document.createElement('div');
  trimMenuEl.style.cssText = `position:fixed; left:${clientX}px; top:${clientY}px; ` +
    `background:#23262d; border:1px solid #8a5ac0; border-radius:6px; padding:8px; ` +
    `z-index:1000; display:flex; flex-direction:column; gap:6px; font:13px monospace; ` +
    `box-shadow:0 6px 20px rgba(0,0,0,0.5);`;

  const BTN = 'background:#2d323b; color:#e6e6e6; border:1px solid #3a3f4a; border-radius:4px; padding:5px 8px; cursor:pointer; font:inherit;';
  const FIELD = 'background:#1b1e24; color:#e6e6e6; border:1px solid #3a3f4a; border-radius:4px; padding:4px 6px; font:inherit;';

  // action button: runs fn, then closes the panel
  const mkBtn = (label, fn) => {
    const b = document.createElement('button');
    b.textContent = label; b.style.cssText = BTN;
    b.onclick = () => { fn(); hideTrimMenu(); };
    return b;
  };
  // labelled dropdown for a closed set; commits live, panel stays open.
  // opts: [str,...] or [{label,value},...]; blank:'--' label prepends an
  // empty option that maps to null.
  const mkSelect = (label, opts, get, set, blank) => {
    const row = document.createElement('label');
    row.style.cssText = 'display:flex; gap:8px; align-items:center; justify-content:space-between;';
