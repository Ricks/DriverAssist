    row.appendChild(document.createTextNode(label));
    const sel = document.createElement('select');
    sel.style.cssText = FIELD;
    if (blank) { const o = document.createElement('option'); o.value = ''; o.textContent = blank; sel.appendChild(o); }
    for (const it of opts) {
      const o = document.createElement('option');
      o.value = String(typeof it === 'object' ? it.value : it);
      o.textContent = typeof it === 'object' ? it.label : it;
      sel.appendChild(o);
    }
    const cur = get();
    sel.value = cur == null ? '' : String(cur);
    sel.onchange = () => { set(sel.value === '' ? null : sel.value); scheduleSave(); draw(); renderTimeline(); };
    row.appendChild(sel);
    return row;
  };
  // labelled checkbox group backed by an array; keeps canonical option order
  const mkCheckboxRow = (labelText, options, get, set) => {
    const row = document.createElement('div');
    row.style.cssText = 'display:flex; gap:10px; align-items:center; font-size:12px;';
    row.appendChild(document.createTextNode(labelText));
    for (const opt of options) {
      const lab = document.createElement('label');
      lab.style.cssText = 'display:flex; gap:3px; align-items:center; cursor:pointer;';
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = (get() || []).includes(opt);
      cb.onchange = () => {
        const s = new Set(get() || []);
        cb.checked ? s.add(opt) : s.delete(opt);
        set(options.filter(o => s.has(o)));
        scheduleSave(); draw(); renderTimeline();
      };
      lab.appendChild(cb);
      lab.appendChild(document.createTextNode(opt));
      row.appendChild(lab);
    }
    return row;
  };
  // labelled field: commits live, blank -> null, panel stays open
  const mkField = (label, get, set, opts = {}) => {
    const row = document.createElement('label');
    row.style.cssText = 'display:flex; gap:8px; align-items:center; justify-content:space-between;';
    row.appendChild(document.createTextNode(label));
    const inp = document.createElement('input');
    inp.type = opts.number ? 'number' : 'text';
    if (opts.number) inp.step = 'any';
    if (opts.placeholder) inp.placeholder = opts.placeholder;
    inp.style.cssText = FIELD + `width:${opts.width || 90}px;`;
    const v = get();
    inp.value = v == null ? '' : v;
    inp.oninput = () => {
      if (opts.number) {
        const n = parseFloat(inp.value);
        set(inp.value.trim() === '' || !Number.isFinite(n) ? null : n);
      } else {
        set(inp.value.trim() || null);
      }
      scheduleSave(); draw(); renderTimeline();
    };
    row.appendChild(inp);
    return row;
  };
  // number entry in m or yd, kept as metres. Switching the unit restates
  // the stored value; typing is always read in the current unit.
  const mkMetersField = (labelText, getM, setM) => {
    const row = document.createElement('label');
    row.style.cssText = 'display:flex; gap:8px; align-items:center; justify-content:space-between;';
    row.appendChild(document.createTextNode(labelText));
    let unit = 'm';
    const inp = document.createElement('input');
    inp.type = 'number'; inp.step = 'any'; inp.style.cssText = FIELD + 'width:80px;';
    const show = () => {
      const m = getM();
      inp.value = m == null ? '' : +(unit === 'yd' ? m * METERS_TO_YARDS : m).toFixed(3);
    };
    inp.oninput = () => {
      const n = parseFloat(inp.value);
      setM((inp.value.trim() === '' || !Number.isFinite(n)) ? null : (unit === 'yd' ? n / METERS_TO_YARDS : n));
      scheduleSave(); draw(); renderTimeline();
    };
    const unitSel = document.createElement('select');
    unitSel.style.cssText = FIELD;
    for (const u of ['m', 'yd']) { const o = document.createElement('option'); o.value = u; o.textContent = u; unitSel.appendChild(o); }
    unitSel.onchange = () => { unit = unitSel.value; show(); };  // restate stored metres in the new unit
    show();
    row.appendChild(inp); row.appendChild(unitSel);
    return row;
  };

  const topRow = document.createElement('div');
  topRow.style.cssText = 'display:flex; gap:6px;';
  if (isAnomaly || isCal) {
    // point model -- no start/end to trim, just remove it
    topRow.appendChild(mkBtn('delete', () => {
      store[activeMode] = arr.filter(a => a !== item);
      if (isCal && selectedCalPoint === item) selectedCalPoint = null;
      if (isCal && calFreshPoint === item) calFreshPoint = null;
      scheduleSave(); draw(); renderTimeline();
    }));
  } else {
    // trim start / end -- these finish the interaction, so they close
    topRow.appendChild(mkBtn('◀ trim start', () => {
      if (item.end_t !== null && t >= item.end_t) store[activeMode] = arr.filter(a => a !== item);
      else item.start_t = t;
      scheduleSave(); draw(); renderTimeline();
    }));
    topRow.appendChild(mkBtn('trim end ▶', () => {
      if (t <= item.start_t) store[activeMode] = arr.filter(a => a !== item);
      else item.end_t = t;
      scheduleSave(); draw(); renderTimeline();
    }));
  }
  trimMenuEl.appendChild(topRow);

  const rebuild = () => showTrimMenu(clientX, clientY, arr, item, t);

  if (isCal) {
    // one and only field: the actual (tape-measured) distance to the dot,
    // entered in the CURRENT display unit (yds/m per the units toggle),
    // stored as metres. No per-field unit picker.
    const row = document.createElement('label');
    row.style.cssText = 'display:flex; gap:8px; align-items:center; justify-content:space-between;';
    row.appendChild(document.createTextNode('actual'));
    const inp = document.createElement('input');
    inp.type = 'number'; inp.step = 'any'; inp.style.cssText = FIELD + 'width:90px;';
    const m = item.tape_distance_meters;
    inp.value = m == null ? '' : +(useMetricDistance ? m : m * METERS_TO_YARDS).toFixed(3);
    inp.oninput = () => {
      const n = parseFloat(inp.value);
      item.tape_distance_meters = (inp.value.trim() === '' || !Number.isFinite(n))
        ? null : (useMetricDistance ? n : n / METERS_TO_YARDS);
      if (item.tape_distance_meters != null && calFreshPoint === item) calFreshPoint = null;  // committed -- Esc no longer undoes it
      scheduleSave(); draw(); renderTimeline();
    };
    const unitEl = document.createElement('span');
    unitEl.style.cssText = 'color:#9aa;';
    unitEl.textContent = useMetricDistance ? 'm' : 'yds';
    row.appendChild(inp); row.appendChild(unitEl);
    trimMenuEl.appendChild(row);
  }

  if (isAnomaly) {
    // --- true distance: exactly one of tape (measured) | eyeball (by eye) ---
    const typeRow = document.createElement('div');
    typeRow.style.cssText = 'display:flex; gap:6px; align-items:center;';
    typeRow.appendChild(document.createTextNode('true dist:'));
    for (const ty of ['tape', 'eyeball']) {
      const b = document.createElement('button');
      b.textContent = ty;
      b.style.cssText = BTN + (item.true_distance_type === ty ? ' outline:2px solid #b98ae0;' : '');
      b.onclick = () => {
        item.true_distance_type = item.true_distance_type === ty ? null : ty;
        // the two never coexist -- clear whichever kind isn't selected
        if (item.true_distance_type !== 'tape') item.tape_distance_meters = null;
        if (item.true_distance_type !== 'eyeball') item.eyeball_distance_meters = null;
        scheduleSave(); draw(); renderTimeline(); rebuild();
      };
      typeRow.appendChild(b);
    }
    trimMenuEl.appendChild(typeRow);

    if (item.true_distance_type === 'tape') {
      trimMenuEl.appendChild(mkMetersField('tape', () => item.tape_distance_meters, v => item.tape_distance_meters = v));
    } else if (item.true_distance_type === 'eyeball') {
      trimMenuEl.appendChild(mkMetersField('eyeball', () => item.eyeball_distance_meters, v => item.eyeball_distance_meters = v));
    }

    trimMenuEl.appendChild(mkSelect('trunc', TRUNCATION_TYPES,
      () => item.truncation_type, v => {
        item.truncation_type = v || 'none';
        if (item.truncation_type !== 'other') item.truncation_sides = [];
        rebuild();  // show/hide the sides row
      }));
    if (item.truncation_type === 'other') {
      if (!Array.isArray(item.truncation_sides)) item.truncation_sides = [];
      trimMenuEl.appendChild(mkCheckboxRow('sides:', TRUNCATION_SIDES,
        () => item.truncation_sides, v => { item.truncation_sides = v; }));
    }
  }

  if (!isCal) trimMenuEl.appendChild(mkField('note', () => item.note, v => item.note = v, { placeholder: '(optional)', width: 200 }));

  const doneRow = document.createElement('div');
  doneRow.style.cssText = 'display:flex; justify-content:flex-end;';
  doneRow.appendChild(mkBtn('done', () => {}));
  trimMenuEl.appendChild(doneRow);

  document.body.appendChild(trimMenuEl);
  if (isCal) {   // land the cursor in the distance field immediately -- no second click
    const fld = trimMenuEl.querySelector('input[type=number]');
    if (fld) { fld.focus(); fld.select(); }
  }

  // keep the panel inside the viewport
  const r = trimMenuEl.getBoundingClientRect();
  if (r.bottom > window.innerHeight - 8) trimMenuEl.style.top = Math.max(8, window.innerHeight - r.height - 8) + 'px';
  if (r.right > window.innerWidth - 8) trimMenuEl.style.left = Math.max(8, window.innerWidth - r.width - 8) + 'px';

  // outside-click dismiss (deferred so the opening click doesn't trip it)
  trimMenuDismiss = (ev) => { if (trimMenuEl && !trimMenuEl.contains(ev.target)) hideTrimMenu(); };
  setTimeout(() => document.addEventListener('mousedown', trimMenuDismiss), 0);
}

function hideTrimMenu() {
  if (trimMenuDismiss) { document.removeEventListener('mousedown', trimMenuDismiss); trimMenuDismiss = null; }
  if (trimMenuEl) { trimMenuEl.remove(); trimMenuEl = null; }
  flushSave();   // "done" / Esc / outside-click / clicking another box all land here -- commit any pending edit now
  if (calPopupPoint) {   // popup closed -> the dot's actual/calc become visible again
    calPopupPoint = null; calPopupXY = null;
    if (MODES[activeMode] && MODES[activeMode].kind === 'distance_calibration') draw();
  }
}

let pendingSaveMode = null;
function postGroundTruth(mode) {
  return fetch(`/api/ground_truth/${mode}`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(store[mode]),
  }).then(() => { document.getElementById('saveState').textContent = 'saved'; });
}
function scheduleSave() {
  pendingSaveMode = activeMode;
  document.getElementById('saveState').textContent = 'saving...';
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { saveTimer = null; const m = pendingSaveMode; pendingSaveMode = null; postGroundTruth(m); }, 400);
}
// Fire a pending debounced save immediately (no-op if nothing is pending).
function flushSave() {
  if (!saveTimer) return;
  clearTimeout(saveTimer); saveTimer = null;
  const m = pendingSaveMode; pendingSaveMode = null;
  if (m) postGroundTruth(m);
}

// --- Timeline strip (click-to-seek, drag-to-scrub, and segment markers
// for labeling modes) ---
// Upward triangles under the scrub bar: one per distinct frame that has
// point entries, click to jump there. Shared by Distance Calibration and
// Distance Anomaly -- each renders its own in its own highlight colour,
// and only in its own mode.
function renderFrameTriangles(items, color, noun, nounPlural) {
  const strip = document.getElementById('calFrameMarkers');
  const byFrame = new Map();
  for (const it of items) {
    if (it.t == null) continue;
    byFrame.set(it.t, (byFrame.get(it.t) || 0) + 1);
  }
  for (const [t, n] of byFrame) {
    const tri = document.createElement('div');
    tri.className = 'calframe';
    tri.style.left = (t / duration * 100) + '%';
    tri.style.color = color;
    tri.title = `frame @ ${t.toFixed(2)}s -- ${n} ${n === 1 ? noun : (nounPlural || noun + 's')}; click to jump`;
    tri.addEventListener('click', () => seekTo(t));
    strip.appendChild(tri);
  }
}
function renderTimeline() {
  timeline.querySelectorAll('.seg, .mark, .calmark').forEach(el => el.remove());
  const cfg = MODES[activeMode];
  const strip = document.getElementById('calFrameMarkers');
  const hasStrip = cfg && (cfg.kind === 'distance_calibration' || cfg.kind === 'distance_anomaly');
  strip.style.display = hasStrip ? '' : 'none';
  strip.innerHTML = '';
  if (!duration) return;
  if (cfg.kind === 'flow_debug') return; // read-only mode, nothing to show

  if (cfg.kind === 'distance_calibration') {
    for (const p of store.distance_calibration) {
      if (p.t == null) continue;
      const el = document.createElement('div');
      el.className = 'calmark';
      el.style.left = (p.t / duration * 100) + '%';
      el.style.background = calMarkerColor;   // follow the user-chosen marker colour
      el.title = `${p.t.toFixed(2)}s  actual ${distU(p.tape_distance_meters)}  calc ${distU(p.calc_distance_meters)}`;
      timeline.appendChild(el);
    }
    renderFrameTriangles(store.distance_calibration, calMarkerColor, 'point');
    return;
  }

  if (cfg.kind === 'distance_anomaly') {
    // point annotations -> thin ticks, not bars
    for (const a of store[activeMode]) {
      if (a.t == null) continue; // legacy range entry with no point t -- skip
      const el = document.createElement('div');
      el.className = 'mark' + (a.note ? ' noted' : '');
      el.style.left = (a.t / duration * 100) + '%';
      el.title = `#${a.trackID}  ${a.t.toFixed(2)}s\n${anomalyTrueDistText(a)}, ${anomalyTruncText(a)}` +
        (a.note ? `\nnote: ${a.note}` : '');
      timeline.appendChild(el);
    }
    renderFrameTriangles(store.distance_anomaly, DISTANCE_ANOMALY_COLOR, 'anomaly', 'anomalies');
    return;
  }

  for (const a of store[activeMode]) {
    const end = a.end_t === null ? duration : a.end_t;
    const el = document.createElement('div');
    el.className = 'seg' + (a.note ? ' noted' : '');
    el.style.left = (a.start_t / duration * 100) + '%';
    el.style.width = Math.max(0.15, (end - a.start_t) / duration * 100) + '%';
    const tag = (cfg.kind === 'single')
      ? `#${a.trackID}`
      : `vehicle #${a.vehicleTrackID} riders:${a.riderTrackIDs.map(id => '#' + id).join(',') || 'none'}`;
    el.title = `${tag}  ${a.start_t.toFixed(1)}s - ${a.end_t === null ? 'open' : a.end_t.toFixed(1) + 's'}` +
      (a.note ? `\nnote: ${a.note}` : '');
    timeline.appendChild(el);
  }
}
const timelineFill = document.getElementById('timelineFill');
let playhead = null;
function renderPlayhead() {
  if (!duration) return;
  if (!playhead) { playhead = document.createElement('div'); playhead.className = 'playhead'; timeline.appendChild(playhead); }
  const pct = (video.currentTime / duration * 100) + '%';
  playhead.style.left = pct;
  timelineFill.style.width = pct;
}
function seekFromEvent(e) {
  const rect = timeline.getBoundingClientRect();
  const frac = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
  seekTo(frac * duration);
}
let scrubbing = false;
timeline.addEventListener('mousedown', (e) => {
  if (!duration) return;
  scrubbing = true;
  video.pause(); stopReverse(); setPlayPauseLabel();
  seekFromEvent(e);
});
window.addEventListener('mousemove', (e) => {
  if (scrubbing) seekFromEvent(e);
});
window.addEventListener('mouseup', () => { scrubbing = false; });

// --- Playback / stepping ---
function seekTo(t) {
  video.currentTime = Math.max(0, Math.min(duration || Infinity, t));
}
video.addEventListener('timeupdate', draw);
video.addEventListener('seeked', draw);

function stepSize() { return parseFloat(document.getElementById('stepSize').value) || 0.067; }

// A seek is asynchronous -- the browser has to demux/decode to the target
// frame, which for a single ~0.067s (one video frame) step can take longer
// than the click/key-repeat interval a human (or a held-down arrow key)
// actually produces. CONFIRMED 2026-08-24: firing seekTo() again before the
// previous seek's 'seeked' event lands causes the decoder to skip straight
// to the LATEST requested target, silently dropping every frame in
// between -- "single-stepping moves by many frames," even though each
// individual seekTo() call itself was requesting exactly one frame's worth
// of movement. Guarding stepFwd/stepBack so a step is ignored while the
// previous one is still resolving forces one visible frame per click/key
// press, at the cost of not queuing up rapid repeats -- the right tradeoff
// for a tool whose whole point is inspecting individual frames.
let stepPending = false;
video.addEventListener('seeked', () => { stepPending = false; });
function stepBy(delta) {
  if (stepPending) return;
  stepPending = true;
  video.pause(); stopReverse(); setPlayPauseLabel();
  seekTo(video.currentTime + delta);
}

document.getElementById('stepFwd').addEventListener('click', () => stepBy(stepSize()));
document.getElementById('stepBack').addEventListener('click', () => stepBy(-stepSize()));

document.getElementById('speed').addEventListener('change', (e) => {
  video.playbackRate = parseFloat(e.target.value);
});

const unitsToggleBtn = document.getElementById('unitsToggle');
unitsToggleBtn.textContent = useMetricDistance ? 'm' : 'yds';   // reflect the persisted choice on load
unitsToggleBtn.addEventListener('click', () => {
  useMetricDistance = !useMetricDistance;
  settingSave({ useMetricDistance });
  unitsToggleBtn.textContent = useMetricDistance ? 'm' : 'yds';
  draw();
  if (calPopupPoint && calPopupXY) {   // re-render the open "actual" field in the new unit
    const p = calPopupPoint, xy = calPopupXY;
    showTrimMenu(xy.x, xy.y, store.distance_calibration, p, p.t);
    calPopupPoint = p; calPopupXY = xy;
    draw();
  }
});

// Marker-colour picker: a row of colour boxes; the current one carries a
// contrasting ring.
const calColorSwatches = document.getElementById('calColorSwatches');
function renderCalSwatches() {
  calColorSwatches.innerHTML = '';
  for (const name of CAL_MARKER_COLORS) {
    const b = document.createElement('button');
    b.className = 'calswatch' + (name === calMarkerColor ? ' sel' : '');
    b.style.background = name;
    b.title = name;
    if (name === calMarkerColor) b.style.setProperty('--ring', ringForColor(name));
    b.addEventListener('click', () => {
      calMarkerColor = name;
      settingSave({ calMarkerColor: name });
      renderCalSwatches();
      draw();
      renderTimeline();   // timeline ticks + frame triangles follow the marker colour
    });
    calColorSwatches.appendChild(b);
  }
}
renderCalSwatches();

const calBoxesToggleBtn = document.getElementById('calBoxesToggle');
calBoxesToggleBtn.addEventListener('click', () => {
  showCalBoxes = !showCalBoxes;
  calBoxesToggleBtn.textContent = showCalBoxes ? 'boxes: on' : 'boxes: off';
  draw();
});

// Distance Calibration zoom buttons -- keyboard/click equivalents of the
// scroll-wheel gesture, anchored at the centre of the #stage viewport.
function calZoomButton(factor) {
  const sr = document.getElementById('stage').getBoundingClientRect();
  calZoomAt(sr.left + sr.width / 2, sr.top + sr.height / 2, factor);
}
document.getElementById('calZoomIn').addEventListener('click', () => calZoomButton(1.5));
document.getElementById('calZoomOut').addEventListener('click', () => calZoomButton(1 / 1.5));
document.getElementById('calZoomReset').addEventListener('click', resetCalZoom);
document.getElementById('calHandToggle').addEventListener('click', () => setCalHandTool(!calHandTool));

const playPauseBtn = document.getElementById('playPause');
playPauseBtn.addEventListener('click', () => {
  stopReverse();
  if (video.paused) { video.play(); } else { video.pause(); }
  setPlayPauseLabel();
});
video.addEventListener('play', setPlayPauseLabel);
video.addEventListener('pause', setPlayPauseLabel);
function setPlayPauseLabel() {
  playPauseBtn.textContent = video.paused ? '▶ play' : '⏸ pause';
}

// Reverse playback: browsers don't support negative playbackRate reliably,
// so this simulates it with a timer decrementing currentTime -- not
// hardware-decoded reverse, but smooth enough for scrubbing back through footage.
const reverseBtn = document.getElementById('playRev');
reverseBtn.addEventListener('click', () => {
  if (reverseTimer) { stopReverse(); return; }
  video.pause();
  const rate = parseFloat(document.getElementById('speed').value);
  reverseBtn.classList.add('active');
  reverseTimer = setInterval(() => {
    const next = video.currentTime - rate * 0.05;
    if (next <= 0) { seekTo(0); stopReverse(); return; }
    seekTo(next);
  }, 50);
});
function stopReverse() {
  if (reverseTimer) { clearInterval(reverseTimer); reverseTimer = null; }
  reverseBtn.classList.remove('active');
}

// --- Magnifier / loupe ----------------------------------------------------
// Cursor-following circular magnifier for pixel-precise box checking on
// small/distant vehicles. Composites the raw <video> frame with the
// <canvas id="overlay"> bitmap (so drawn boxes/labels/flow arrows enlarge
// too) into a clipped circle offset from the cursor. Toggle via the button
// or 'z'; scroll-wheel (or +/-) over the video changes zoom. Purely a
// display aid -- it has pointer-events:none and never intercepts the
// click-to-label handler underneath it.
function updateLoupe() {
  if (!loupeActive || !lastLoupeClient) return;
  const r = video.getBoundingClientRect();
  if (!r.width || !video.videoWidth) { loupe.style.display = 'none'; return; }
  const mx = lastLoupeClient.x - r.left, my = lastLoupeClient.y - r.top;
  // Only bail when the cursor is genuinely off the video (the overlay
  // mouseleave handler covers that too). Staying alive a hair past the
  // edge lets the circle overhang the frame border, so edge/truncation
  // work right at the boundary doesn't blank the loupe out.
  if (mx < -2 || my < -2 || mx > r.width + 2 || my > r.height + 2) { loupe.style.display = 'none'; return; }

  const srcW = LOUPE_SIZE / loupeZoom, srcH = LOUPE_SIZE / loupeZoom;
  const sx = mx - srcW / 2, sy = my - srcH / 2;                    // source window, display px
  const kx = video.videoWidth / r.width, ky = video.videoHeight / r.height;  // display px -> intrinsic px

  lctx.save();
  lctx.clearRect(0, 0, LOUPE_SIZE, LOUPE_SIZE);
  lctx.beginPath();
  lctx.arc(LOUPE_SIZE / 2, LOUPE_SIZE / 2, LOUPE_SIZE / 2 - 1, 0, Math.PI * 2);
  lctx.clip();
  lctx.fillStyle = '#000';
  lctx.fillRect(0, 0, LOUPE_SIZE, LOUPE_SIZE);
  // <video> drawImage source is intrinsic px; the overlay canvas backing
  // store is sized in display px (see resizeCanvas), so it samples directly.
  try { lctx.drawImage(video, sx * kx, sy * ky, srcW * kx, srcH * ky, 0, 0, LOUPE_SIZE, LOUPE_SIZE); } catch (_) {}
  try { lctx.drawImage(overlay, sx, sy, srcW, srcH, 0, 0, LOUPE_SIZE, LOUPE_SIZE); } catch (_) {}
  lctx.restore();

  lctx.strokeStyle = 'rgba(255,255,255,0.75)';
  lctx.lineWidth = 1;
  lctx.beginPath();
  lctx.moveTo(LOUPE_SIZE / 2 - 7, LOUPE_SIZE / 2); lctx.lineTo(LOUPE_SIZE / 2 + 7, LOUPE_SIZE / 2);
  lctx.moveTo(LOUPE_SIZE / 2, LOUPE_SIZE / 2 - 7); lctx.lineTo(LOUPE_SIZE / 2, LOUPE_SIZE / 2 + 7);
  lctx.stroke();
  lctx.fillStyle = 'rgba(0,0,0,0.55)';
  lctx.fillRect(LOUPE_SIZE - 48, LOUPE_SIZE - 34, 40, 15);
  lctx.fillStyle = '#fff';
  lctx.font = '11px monospace';
  lctx.fillText(loupeZoom.toFixed(1) + 'x', LOUPE_SIZE - 45, LOUPE_SIZE - 23);

  // Centre the loupe on the cursor so it magnifies exactly the point it
  // covers (crosshair == cursor). It's allowed to overhang the frame edge
  // -- the out-of-frame part just shows the black fill -- and it never gets
  // shoved back inside or hidden for touching the border.
  loupe.style.left = (video.offsetLeft + mx - LOUPE_SIZE / 2) + 'px';
  loupe.style.top = (video.offsetTop + my - LOUPE_SIZE / 2) + 'px';
  loupe.style.display = 'block';
}

function setLoupe(on) {
  loupeActive = on;
  document.getElementById('loupeToggle').classList.toggle('active', on);
  if (!on) { loupe.style.display = 'none'; return; }
  flashHint('Loupe on -- hover the video, scroll or +/- to zoom, z to toggle');
  updateLoupe();
}
function bumpLoupeZoom(factor) {
  loupeZoom = Math.max(2, Math.min(12, loupeZoom * factor));
  updateLoupe();
}

document.getElementById('loupeToggle').addEventListener('click', () => setLoupe(!loupeActive));
overlay.addEventListener('mousemove', (e) => {
  lastLoupeClient = { x: e.clientX, y: e.clientY };
  if (loupeActive) updateLoupe();
});
overlay.addEventListener('mouseleave', () => { if (loupeActive) loupe.style.display = 'none'; });
overlay.addEventListener('wheel', (e) => {
  if (MODES[activeMode].kind === 'distance_calibration') {
    // Standard image-viewer wheel semantics, so an ordinary scroll near a
    // dot can't silently zoom the view out (the reported bug):
    //   ctrl/cmd + wheel (and the trackpad pinch gesture, which the OS
    //     delivers as ctrl+wheel) -> zoom at the cursor
    //   plain wheel while zoomed in           -> pan the view
    //   plain wheel at 1x                     -> nothing (let the page be)
    // Discrete zoom is also always available on the +/- / 1:1 buttons.
    if (e.ctrlKey || e.metaKey) {
      e.preventDefault();
      calZoomAt(e.clientX, e.clientY, e.deltaY < 0 ? 1.15 : 1 / 1.15);
    } else if (calZoom > 1) {
      e.preventDefault();
      calPanX -= e.deltaX;
      calPanY -= e.deltaY;
      clampCalPan();
      applyCalZoom();
      persistCalZoomSoon();
    }
    return;
  }
  if (!loupeActive) return;
  e.preventDefault();
  bumpLoupeZoom(e.deltaY < 0 ? 1.15 : 1 / 1.15);
}, { passive: false });

// distance_calibration: drag to reposition the zoomed view -- ONLY with the
// hand tool active. Without it, a mousedown on the overlay is always a
// dot click/select; a plain-drag pan "fallback" made ordinary clicks
// unreliable (any few-px hand tremor between down and up was read as a pan
// and swallowed the click, so selecting a dot appeared to do nothing / the
// view drifted). A drag that actually moved swallows its trailing 'click'
// so panning never drops a stray dot.
overlay.addEventListener('mousedown', (e) => {
  if (MODES[activeMode].kind !== 'distance_calibration' || !calHandTool || calZoom === 1 || e.button !== 0) return;
  calPanDrag = { startX: e.clientX, startY: e.clientY, panX0: calPanX, panY0: calPanY, moved: false };
  overlay.style.cursor = 'grabbing';
});
window.addEventListener('mousemove', (e) => {
  if (!calPanDrag) return;
  const dx = e.clientX - calPanDrag.startX, dy = e.clientY - calPanDrag.startY;
  if (!calPanDrag.moved && Math.hypot(dx, dy) < 3) return;   // tolerate a jittery click
  calPanDrag.moved = true;
  calPanX = calPanDrag.panX0 + dx;
  calPanY = calPanDrag.panY0 + dy;
  clampCalPan();
  applyCalZoom();
});
window.addEventListener('mouseup', () => {
  if (calPanDrag && calPanDrag.moved) { suppressNextCalClick = true; persistCalZoom(); }
  calPanDrag = null;
  if (calHandTool && MODES[activeMode].kind === 'distance_calibration') overlay.style.cursor = 'grab';
});

document.addEventListener('keydown', (e) => {
  const inInput = e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT';
  if (e.code === 'Escape') {
    if (inInput) { e.target.blur(); hideTrimMenu(); return; }
    hideTrimMenu();
    const k = MODES[activeMode].kind;
    if (k === 'distance_anomaly') { pristineAnomalyPurge(selectedTrackID); selectedTrackID = null; draw(); }
    else if (k === 'distance_calibration') { pristineCalPurge(); selectedCalPoint = null; draw(); }
    else if (k === 'flow_debug') { selectedTrackID = null; draw(); }
    return;
  }
  if (inInput) return;
  // distance_calibration: arrow keys nudge the selected dot for sub-pixel
  // placement (0.5 native px, Shift = 5 px), same as the old cone tool.
  if (MODES[activeMode].kind === 'distance_calibration' && selectedCalPoint &&
      ['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.code)) {
    e.preventDefault();
    const step = e.shiftKey ? 5 : 0.5;
    const nw = video.videoWidth || overlay.width, nh = video.videoHeight || overlay.height;
    if (e.code === 'ArrowLeft')  selectedCalPoint.x -= step / nw;
    if (e.code === 'ArrowRight') selectedCalPoint.x += step / nw;
    if (e.code === 'ArrowUp')    selectedCalPoint.y -= step / nh;
    if (e.code === 'ArrowDown')  selectedCalPoint.y += step / nh;
    if (calFreshPoint === selectedCalPoint) calFreshPoint = null;  // deliberately moved -- keep it through Esc
    scheduleSave(); recomputeCalPoint(selectedCalPoint); draw(); renderTimeline();
    return;
  }
  // distance_calibration: 'h' toggles the hand (pan) tool
  if (MODES[activeMode].kind === 'distance_calibration' && e.code === 'KeyH') {
    e.preventDefault(); setCalHandTool(!calHandTool); return;
  }
  if (e.code === 'KeyZ') { e.preventDefault(); setLoupe(!loupeActive); return; }
  if (loupeActive && (e.code === 'Equal' || e.code === 'NumpadAdd')) { e.preventDefault(); bumpLoupeZoom(1.15); return; }
  if (loupeActive && (e.code === 'Minus' || e.code === 'NumpadSubtract')) { e.preventDefault(); bumpLoupeZoom(1 / 1.15); return; }
  if (e.code === 'Space') { e.preventDefault(); playPauseBtn.click(); }
  else if (e.code === 'ArrowRight') { e.preventDefault(); document.getElementById('stepFwd').click(); }
  else if (e.code === 'ArrowLeft') { e.preventDefault(); document.getElementById('stepBack').click(); }
});
</script>
</body>
</html>
